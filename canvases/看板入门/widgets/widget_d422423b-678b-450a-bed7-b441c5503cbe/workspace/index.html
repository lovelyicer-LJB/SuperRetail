<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>关心的事，实时呈现</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        font: 16px/1.45
          var(
            --kimi-font-sans,
            "Inter",
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Text",
            "PingFang SC",
            "Microsoft YaHei",
            sans-serif
          );
        color: #121212;
        background: transparent;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #1684ed;
        outline-offset: 4px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      .stage {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(0, 2fr);
        gap: 32px;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 44px 44px 16px;
        background: linear-gradient(135deg, #e1f5ff, #d1edfe 55%, #c9e8f8);
        overflow: clip;
      }

      /* Decoration stays behind the native Widget content and never catches input. */
      .atmosphere {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }
      .intro {
        align-self: center;
        padding-bottom: 10px;
        min-width: 0;
      }
      .intro h1 {
        font-size: clamp(34px, 4vw, 44px);
        font-weight: 750;
        line-height: 1.18;
        letter-spacing: -0.025em;
        max-width: 350px;
      }
      .intro h1 span {
        display: block;
      }
      .intro h1 .accent {
        color: #1684ed;
      }
      .intro p {
        font-size: 17px;
        line-height: 1.55;
        color: #667784;
        margin-top: 17px;
        max-width: 300px;
      }
      .showcase {
        min-width: 0;
        position: relative;
        isolation: isolate;
      }
      .example-request {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        min-height: 78px;
        margin-bottom: 10px;
      }
      .request-bubble {
        max-width: 94%;
        padding: 11px 18px;
        border: 1px solid #bddff1;
        border-radius: 18px 18px 4px 18px;
        background: #fff;
        color: #173c57;
        font-size: 18px;
        line-height: 26px;
        font-weight: 500;
        box-shadow: 0 5px 16px #2666900d;
      }
      .board {
        height: 340px;
        position: relative;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .board-footer {
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
        color: #72818d;
        font-size: 11px;
      }
      .refresh {
        border: 0;
        background: transparent;
        color: #536f87;
        padding: 2px 0;
        font-size: 11px;
        white-space: nowrap;
      }
      .switcher {
        margin-top: 29px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        max-width: 300px;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        flex: 1;
      }
      .tab {
        position: relative;
        overflow: hidden;
        text-align: center;
        background: #f5f8fb;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 6px;
        font-size: 14px;
        line-height: 1.3;
        color: #6e7e8b;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .tab[aria-selected="true"] {
        color: #0868c9;
        font-weight: 600;
        background: #edf6ff;
        border-color: #c8e2f9;
      }
      .tab:hover {
        color: #1b6da9;
        background: #edf4fa;
      }
      .tab:before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: #60b5ff;
      }
      .tab[aria-selected="true"]:before {
        width: var(--progress, 0%);
      }

      /* A scaled teaching preview, not a nested native Canvas or a second layout owner.
   Native Canvas uses 12 columns, 12px gaps, and 12px outer Widget corners. */
      .mini-canvas {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: repeat(14, minmax(0, 1fr));
        gap: 8px;
        height: 100%;
        min-height: 0;
        min-width: 0;
      }
      .mini-widget {
        min-width: 0;
        min-height: 0;
        border: 1px solid #dce3e9;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .mk-shell {
        color: #dce3e9;
        font-family: var(--kimi-font-sans, sans-serif);
        font-variant-numeric: tabular-nums;
        --mk-up: var(--kimi-chart-2, #ef6574);
        --mk-down: var(--kimi-chart-1, #67b8fe);
      }
      .mk-shell,
      .mk-shell * {
        box-sizing: border-box;
      }
      .mk-shell > .mini-widget {
        background: #1d2127;
        border-color: #25313b;
      }
      .mk-shell button {
        font: inherit;
        cursor: pointer;
      }
      .mk-shell button:focus-visible,
      .mk-chart:focus-visible {
        outline: 2px solid #f3f7fb;
        outline-offset: 2px;
      }
      .mk-main {
        grid-column: 1 / 9;
        grid-row: 1 / 15;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 14px;
      }
      .mk-heading {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .mk-name {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .mk-name h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mk-name > span {
        font-size: 11px;
        color: #8495a7;
      }
      .mk-ranges {
        display: flex;
        gap: 1px;
        flex: none;
        padding: 2px;
        background: #ffffff09;
        border-radius: 6px;
      }
      .mk-ranges button {
        min-width: 29px;
        padding: 3px 4px;
        border: 0;
        background: transparent;
        color: #91a2b6;
        border-radius: 4px;
        font-size: 12px;
        line-height: 16px;
      }
      .mk-ranges button[aria-pressed="true"] {
        background: #fff;
        color: #172331;
      }
      .mk-ranges button:hover {
        color: #fff;
        background: #ffffff25;
      }
      .mk-ranges button[aria-pressed="true"]:hover {
        color: #172331;
        background: #e9f2fb;
      }
      .mk-quote {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 11px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .mk-quote > strong {
        font-size: 24px;
        font-weight: 400;
      }
      .mk-quote > strong small {
        font-size: 12px;
        font-weight: 400;
        color: #8495a7;
        margin-left: 6px;
      }
      .mk-quote > span {
        font-size: 12px;
      }
      .mk-quote .mk-quote-label {
        font-size: 11px;
        color: #8190a1;
        margin-left: auto;
      }
      .mk-legend {
        display: flex;
        gap: 12px;
        align-items: center;
        color: #a1b0bf;
        font-size: 11px;
        line-height: 20px;
        margin-top: 3px;
      }
      .mk-legend > span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .mk-legend i {
        display: inline-block;
        width: 12px;
        height: 0;
        border-top: 1.5px solid #f0cd83;
      }
      .mk-legend .mk-ma20-key {
        border-color: #a49cdb;
        border-top-style: dashed;
      }
      .mk-legend .mk-adjustment {
        margin-left: auto;
        color: #7c8c9d;
      }
      .mk-chart {
        min-height: 0;
        flex: 1;
        position: relative;
        cursor: crosshair;
        touch-action: pan-y;
      }
      .mk-chart svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .mk-chart svg text {
        font-family: var(--kimi-font-sans, sans-serif);
      }
      .mk-up {
        color: var(--mk-up);
      }
      .mk-down {
        color: var(--mk-down);
      }
      .mk-grid {
        stroke: #70889d26;
        stroke-width: 0.7;
        stroke-dasharray: 2 4;
      }
      .mk-axis-text {
        font-size: 11px;
        fill: #8c9baa;
      }
      .mk-wick {
        stroke: currentColor;
        stroke-width: 1;
      }
      .mk-candle {
        fill: currentColor;
      }
      .mk-volume {
        fill: currentColor;
        opacity: 0.5;
      }
      .mk-ma5,
      .mk-ma20 {
        fill: none;
        stroke: #f0cd83;
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mk-ma20 {
        stroke: #a49cdb;
        stroke-dasharray: 3 2;
      }
      .mk-cross {
        pointer-events: none;
      }
      .mk-cross line {
        stroke: #cadce7;
        stroke-width: 1;
        stroke-dasharray: 3 3;
        opacity: 0.65;
      }
      .mk-cross circle {
        fill: #10151c;
        stroke: #ecf7ff;
        stroke-width: 1.5;
      }
      .mk-tooltip {
        position: absolute;
        top: 3px;
        right: 45px;
        z-index: 2;
        width: 250px;
        max-width: calc(100% - 12px);
        border: 1px solid #486074;
        border-radius: 7px;
        padding: 8px 9px;
        background: #182431f5;
        box-shadow: 0 3px 10px #0005;
        color: #f1f5fa;
        pointer-events: none;
      }
      .mk-tooltip[hidden] {
        display: none;
      }
      .mk-tooltip.mk-tip-left {
        left: 3px;
        right: auto;
      }
      .mk-tip-date {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 11px;
        line-height: 1.5;
        color: #99acbf;
      }
      .mk-tip-date strong {
        color: #eef5fb;
        font-weight: 500;
        font-size: 12px;
      }
      .mk-tip-values {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px 12px;
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.3;
      }
      .mk-tip-values > span {
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .mk-tip-values i {
        font-style: normal;
        color: #9aabbc;
      }
      .mk-watch {
        grid-column: 9 / 13;
        grid-row: 1 / 10;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 3px;
      }
      .mk-watch-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: none;
        font-size: 12px;
        line-height: 17px;
        color: #98a9ba;
        padding-bottom: 5px;
      }
      .mk-watch-title > span {
        color: #64778b;
        font-size: 11px;
      }
      .mk-index {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        padding: 5px 6px;
        border: 1px solid #ffffff12;
        border-radius: 5px;
        background: transparent;
        color: #b1c5d9;
        text-align: left;
        font-size: 12px;
        line-height: 16px;
      }
      .mk-index > span {
        color: #829ab0;
        font-size: 11px;
      }
      .mk-index > strong {
        min-width: 0;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mk-index[aria-pressed="true"] {
        background: #99ccff17;
        border-color: #8cc8ff35;
        color: #c9e6ff;
      }
      .mk-watch-row {
        flex: 1;
        min-height: 0;
        border: 1px solid transparent;
        border-radius: 5px;
        text-align: left;
        color: #e5edf6;
        background: transparent;
        padding: 4px 6px;
        margin: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .mk-watch-row:hover {
        background: #ffffff0a;
      }
      .mk-watch-row[aria-pressed="true"] {
        border-color: #ffffff16;
        background: #ffffff09;
      }
      .mk-watch-identity {
        display: flex;
        align-items: baseline;
        gap: 6px;
        width: 100%;
      }
      .mk-watch-name {
        display: block;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mk-watch-code {
        display: block;
        flex: none;
        margin-left: auto;
        color: #8495a7;
        font-size: 11px;
        line-height: 1;
      }
      .mk-watch-price {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
        margin-top: 5px;
        width: 100%;
        font-size: 14px;
        line-height: 1.2;
      }
      .mk-watch-price > span {
        font-size: 11px;
      }
      .mk-watch-empty {
        margin: auto;
        color: #8299ad;
        font-size: 13px;
      }
      .mk-details {
        grid-column: 9 / 13;
        grid-row: 10 / 15;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mk-details-title {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: #98a9ba;
        font-size: 12px;
        line-height: 14px;
      }
      .mk-details-title > span {
        color: #657b91;
        font-size: 10px;
      }
      .mk-details dl {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 12px;
        margin: 0;
      }
      .mk-details dl > div {
        min-width: 0;
      }
      .mk-details dt {
        color: #7f93a6;
        font-size: 11px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .mk-details dd {
        color: #e7f0f8;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.2;
        margin: 2px 0 0;
        white-space: nowrap;
      }
      .mk-empty {
        grid-column: 1 / -1;
        grid-row: 1 / -1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 26px;
        gap: 10px;
      }
      .mk-empty strong {
        font-size: 17px;
        font-weight: 500;
      }
      .mk-empty span {
        color: #8fabc0;
        font-size: 16px;
      }
      .mk-nochart {
        display: grid;
        place-items: center;
        flex: 1;
        color: #8299ad;
        font-size: 16px;
      }
      .mk-noquote {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 12px;
      }
      .mk-noquote > strong {
        font-size: 20px;
        font-weight: 500;
      }
      .mk-noquote > span {
        max-width: 260px;
        color: #8299ad;
        font-size: 14px;
        line-height: 1.5;
      }
      /* Keep dark controls legible against the host's light default button hover. */
      .stage .board .mk-shell button:hover:not(:disabled) {
        background: #ffffff12;
        color: #fff;
      }
      .stage .board .mk-shell .mk-ranges button[aria-pressed="true"]:hover {
        background: #e9f2fb;
        color: #172331;
      }

      .bi-scene {
        color: rgba(0, 0, 0, 0.78);
      }
      .bi-summary {
        grid-column: 1/-1;
        grid-row: 1 / span 5;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
      }
      .bi-header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 23px;
        font-size: 13px;
      }
      .bi-header > strong {
        font-size: 14px;
        font-weight: 500;
      }
      .bi-header > span {
        margin-left: auto;
        color: #8190a0;
        font-size: 12px;
      }
      .bi-period {
        display: flex;
        background: #eef4fa;
        border-radius: 6px;
        padding: 2px;
      }
      .bi-period button {
        border: 0;
        background: none;
        font-size: 13px;
        padding: 2px 8px;
        border-radius: 4px;
      }
      .bi-period button[aria-pressed="true"] {
        background: white;
        color: #087bec;
        box-shadow: 0 1px 3px #193a511a;
      }
      .bi-kpis {
        display: grid;
        grid-template-columns: 1.35fr 0.8fr 0.9fr 0.9fr;
        gap: 14px;
      }
      .bi-kpis > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .bi-kpis span {
        font-size: 13px;
        color: #6f8192;
      }
      .bi-kpis strong {
        font-size: 20px;
        letter-spacing: -0.025em;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .bi-kpis small {
        font-size: 12px;
        color: #708698;
        white-space: nowrap;
      }
      .bi-kpis > div:first-child small {
        color: #1a9188;
      }
      .bi-main {
        display: contents;
      }
      .bi-main header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 500;
        min-height: 20px;
        gap: 8px;
      }
      .bi-main header button {
        background: none;
        border: 0;
        font-size: 12px;
        color: #3f85b7;
        padding: 0 2px;
        white-space: nowrap;
      }
      .bi-trend {
        grid-column: 1 / span 8;
        grid-row: 6 / span 9;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bi-channels {
        grid-column: 9 / span 4;
        grid-row: 6 / span 9;
        padding: 14px;
        display: flex;
        flex-direction: column;
        background: #f0f7fe;
        border-color: #d7e7f4;
      }
      .bi-chart {
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow: visible;
      }
      .bi-chart text {
        font-size: 12px;
        fill: #72879a;
      }
      .bi-point circle,
      .bi-point text {
        opacity: 0;
        pointer-events: none;
      }
      .bi-point:hover circle,
      .bi-point:hover text,
      .bi-point:focus circle,
      .bi-point:focus text {
        opacity: 1;
      }
      .bi-channel {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 12px 0 3px;
        color: #52697b;
      }
      .bi-channel > span {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        line-height: 1.25;
      }
      .bi-channel b {
        font-weight: 500;
      }
      .bi-channel i {
        display: block;
        height: 6px;
        margin-top: 6px;
        background: #dfebf7;
        border-radius: 2px;
        overflow: hidden;
      }
      .bi-channel em {
        display: block;
        height: 100%;
        border-radius: 2px;
      }
      .bi-channel[aria-pressed="true"] {
        color: #087bec;
      }
      .bi-channel[aria-pressed="true"] span {
        font-weight: 500;
      }
      .bi-insight {
        font-size: 11px;
        line-height: 1.45;
        color: #53728c;
        flex-shrink: 0;
        margin-top: auto;
        padding-top: 10px;
      }
      .bi-insight > span {
        color: #1986ed;
        margin-right: 6px;
      }
      .bi-detail {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-width: thin;
      }
      .bi-detail table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .bi-detail th {
        position: sticky;
        top: 0;
        background: #f7fafc;
        font-weight: 500;
        color: #7c8e9f;
      }
      .bi-detail td,
      .bi-detail th {
        padding: 5px 6px;
        border-bottom: 1px solid #f0f4f8;
      }
      .bi-detail td:first-child,
      .bi-detail th:first-child {
        text-align: left;
      }
      @media (max-width: 850px) {
        .bi-summary,
        .bi-trend,
        .bi-channels {
          padding: 11px;
        }
        .bi-kpis {
          gap: 8px;
        }
        .bi-kpis strong {
          font-size: 20px;
          font-weight: 500;
        }
        .bi-header > span {
          display: none;
        }
        .bi-kpis small {
          font-size: 10px;
        }
        .bi-insight {

      .project-scene {

      .project-scene .pm-milestone-item {

              if (!phases.some((phase) => phase.id === id)) return false;
              if (state.phase === id) return true;
              state.phase = id;

              const task = tasks.find((task) => task.id === id);
              if (!task) return false;
              if (action === "task")

                if (getStatus(task) !== "blocked") return true;
                state.taskStatus[id] = "active";
              } else return false;
            }
            event?.preventDefault?.();
            persist();
            return true;
          }
          return { render, click };

              remember();
              api.openUrl(item.url);
            }
            if (action === "repo") {
              const repo = api
                .getData()
                ?.repositories?.items?.find((r) => String(r.id) === id);
              if (repo) api.openUrl(repo.url);
            }
            if (action === "mail" && mails.some((mail) => mail.id === id))
              selectedMail = id;
            if (action === "mail-back") selectedMail = null;
            if (
              action === "mail-read" &&
              mails.some((mail) => mail.id === id)
            ) {
              mailRead.add(id);
              remember();
            }
            api.render();
            return true;
          }
          return { render, click };
        }

        async function init() {
          await loadState();
          if (destroyed) return;
          const api = {
            en,
            esc,
            render,
            getData: () => payload,
            readState: (key, fallback) => state[key] ?? fallback,
            saveState,
            openUrl,
          };
          scenes = [
            createMarketScene(api),
            createBusinessScene(api),
            createProjectScene(api),
            createNewsScene(api),
          ];
          board.addEventListener("click", (event) => {
            const button = event.target.closest("button");
            if (!button) return;
            scenes[active]?.click?.(button, event);
          });
          board.addEventListener("pointermove", (event) =>
            scenes[active]?.pointer?.(event),
          );
          board.addEventListener("pointerout", (event) => {
            const chart = event.target.closest("[data-market-chart]");
            if (chart && !chart.contains(event.relatedTarget))
              scenes[active]?.leave?.();
          });
          board.addEventListener("keydown", (event) =>
            scenes[active]?.key?.(event),
          );
          tabs.forEach((tab, i) => {
            tab.addEventListener("click", () => select(i));
            tab.addEventListener("keydown", (event) => {
              if (
                ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
              ) {
                event.preventDefault();
                const next =
                  event.key === "Home"
                    ? 0
                    : event.key === "End"
                      ? 3
                      : (i + (event.key === "ArrowRight" ? 1 : 3)) % 4;
                select(next);
                tabs[next].focus({ preventScroll: true });
              }
            });
          });
          stage.addEventListener("pointerleave", () =>
            scenes[active]?.leave?.(),
          );
          stage.addEventListener(
            "pointerdown",
            () => {
              pointerMode = true;
              keyboardFocus = false;
            },
            true,
          );
          stage.addEventListener(
            "keydown",
            () => {
              pointerMode = false;
              keyboardFocus = true;
            },
            true,
          );
          stage.addEventListener("focusin", (event) => {
            keyboardFocus =
              !pointerMode || event.target.matches(":focus-visible");
          });
          stage.addEventListener("focusout", (event) => {
            if (!stage.contains(event.relatedTarget)) {
              pointerMode = false;
              keyboardFocus = false;
            }
          });
          select(0);
          motion();
        }
        document.addEventListener("visibilitychange", motion);
        reduce.addEventListener("change", motion);
        let observer;
        if (typeof IntersectionObserver === "function") {
          observer = new IntersectionObserver(
            (entries) => {
              visible = entries[0]?.isIntersecting ?? true;
              motion();
            },
            { threshold: 0.05 },
          );
          observer.observe(stage);
        }
        window.addEventListener(
          "pagehide",
          () => {
            destroyed = true;
            cancelAnimationFrame(frame);
            clearTimeout(pendingTimer);
            observer?.disconnect();
            atmosphereObserver?.disconnect();
            window.removeEventListener("resize", resizeAtmosphere);
            off.forEach((fn) => {
              if (typeof fn === "function") fn();
            });
            document.removeEventListener("visibilitychange", motion);
            reduce.removeEventListener("change", motion);
          },
          { once: true },
        );
        init();
      })();
    </script>
  </body>
</html>
