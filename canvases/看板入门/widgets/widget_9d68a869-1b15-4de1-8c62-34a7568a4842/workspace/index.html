<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>随心摆放 组合看板</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        font: 16px/1.5
          var(
            --kimi-font-sans,
            "Inter",
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Text",
            "PingFang SC",
            "MiSans",
            "Microsoft YaHei",
            sans-serif
          );
        color: #121212;
        background: transparent;
      }
      button {
        font: inherit;
        color: inherit;
      }
      h1,
      p {
        margin: 0;
      }
      .stage {
        width: 100%;
        height: 100%;
        padding: 64px 28px 20px;
        overflow: auto;
        background: #edf7ff;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .number,
      h1 {
        font-size: 36px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: 0;
        text-wrap: balance;
      }
      .number {
        opacity: 0.7;
      }
      .layout-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }
      .layout-hint {
        font-size: 16px;
        line-height: 24px;
        color: #52606b;
      }
      .change-layout {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        flex: none;
        min-block-size: 36px;
        padding: 6px 18px;
        border: 0;
        border-radius: 999px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        color: #0066d6;
        background: linear-gradient(172deg, #fff, #f7fbff) !important;
        box-shadow: 0 2px 8px #14456b0a;
        cursor: pointer;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }
      .change-layout:hover {
        background: linear-gradient(172deg, #fff, #eff8ff) !important;
        box-shadow: 0 3px 10px #14456b12;
        transform: translateY(-1px);
      }
      .change-layout:active {
        background: #e5f3ff !important;
        transform: scale(0.97);
      }
      .board {
        position: relative;
        height: 160px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 10px;
        isolation: isolate;
      }
      .micro-card {
        position: absolute;
        min-width: 0;
        min-block-size: 0;
        margin: 0;
        padding: 8px;
        border: 1px solid #002e5810;
        border-radius: 10px;
        background: var(--card-bg);
        color: var(--card-ink);
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        overflow: hidden;
        container-type: size;
        cursor: grab;
        touch-action: none;
        user-select: none;
        transform-origin: 0 0;
        transition:
          box-shadow 160ms ease,
          opacity 160ms ease;
      }
      .micro-card:focus-visible {
        outline: 2px solid #0066d6;
        outline-offset: -3px;
      }
      .board.is-dragging .micro-card {
        transition: none;
      }
      .micro-card.is-dragging {
        z-index: 4;
        cursor: grabbing;
        box-shadow: 0 5px 14px #002e5830;
        opacity: 0.92;
      }
      .micro-card.is-drop-target {
        outline: 2px dashed #0066d6;
        outline-offset: -3px;
        filter: brightness(0.93);
      }
      .chart {
        container-name: chart;
        --card-bg: #121212;
        --card-ink: #fff;
        left: 0;
        top: 0;
        width: calc(41.6667% - 4.6667px);
        height: 100%;
      }
      .timer {
        container-name: timer;
        --card-bg: linear-gradient(145deg, #a0dbff, #cbeaff);
        --card-ink: #002e58;
        left: calc(41.6667% + 3.3333px);
        top: 0;
        width: calc(58.3333% - 3.3333px);
        height: calc(50% - 4px);
      }
      .todo {
        --card-bg: #1685ff;
        --card-ink: #fff;
        left: calc(41.6667% + 3.3333px);
        top: calc(50% + 4px);
        width: calc(33.3333% - 5.3333px);
        height: calc(50% - 4px);
      }
      .note {
        container-name: note;
        --card-bg: linear-gradient(145deg, #a0dbff, #cbeaff);
        --card-ink: #002e58;
        left: calc(75% + 6px);
        top: calc(50% + 4px);
        width: calc(25% - 6px);
        height: calc(50% - 4px);
      }
      .chart-face {
        height: 100%;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 6px;
      }
      .chart-metric {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px;
      }
      .chart-value {
        font-size: 24px;
        line-height: 28px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chart-period,
      .chart-axis {
        font-size: 14px;
        line-height: 18px;
        color: #ffffff8f;
      }
      .chart-trend {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 20px;
        overflow: visible;
      }
      .chart-axis {
        display: flex;
        justify-content: space-between;
      }
      .timer-face {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        min-width: 0;
      }
      .timer-dial {
        display: block;
        flex: 0 0 auto;
        width: 54px;
        height: 54px;
      }
      .timer-reading {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .timer-value {
        font-size: 24px;
        font-weight: 700;
        line-height: 28px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .timer-label {
        font-size: 14px;
        line-height: 18px;
        color: #627990;
      }
      .tasks {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 100%;
      }
      .task {
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        line-height: 18px;
        white-space: nowrap;
      }
      .task input {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: 0;
        opacity: 0;
      }
      .task input:focus-visible + .task-check {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .task-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .task-check {
        display: block;
        position: relative;
        flex: 0 0 14px;
        width: 14px;
        height: 14px;
        border: 1px solid #ffffffad;
        border-radius: 4px;
      }
      .task input:checked ~ .task-text {
        color: #ffffffad;
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .task input:checked + .task-check {
        background: #fff;
        border-color: #fff;
      }
      .task input:checked + .task-check::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 4px;
        width: 4px;
        height: 7px;
        border: solid #1685ff;
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }
      .note::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 13px;
        height: 13px;
        background: linear-gradient(45deg, #ffffff50 49%, #edf7ff 50%);
        border-radius: 0 0 0 3px;
      }
      .note-face {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        height: 100%;
      }
      .note-kicker {
        font-size: 14px;
        line-height: 18px;
        font-weight: 600;
        color: #36658a;
      }
      .note-copy {
        margin: 0;
        font-size: 14px;
        line-height: 18px;
        color: #123f62;
      }
      @container chart (max-width: 140px) {
        .chart-metric {
          flex-direction: column;
          align-items: flex-start;
          gap: 0;
        }
      }
      @container chart (max-height: 90px) {
        .chart-face {
          grid-template-columns: 100px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr);
          gap: 10px;
        }
        .chart-metric {
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          gap: 0;
        }
        .chart-axis {
          display: none;
        }
      }
      @container chart (max-width: 150px) and (max-height: 90px) {
        .chart-face {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 24px minmax(0, 1fr);
          gap: 2px;
        }
        .chart-value {
          font-size: 20px;
          line-height: 24px;
        }
        .chart-period {
          display: none;
        }
        .chart-trend {
          min-height: 0;
        }
      }
      @container timer (max-width: 150px) {
        .timer-face {
          gap: 6px;
        }
        .timer-dial {
          width: 32px;
          height: 32px;
        }
        .timer-value {
          font-size: 20px;
          line-height: 24px;
        }
      }
      @container timer (max-width: 100px) and (max-height: 90px) {
        .timer-dial {
          width: 28px;
          height: 28px;
        }
        .timer-value {
          font-size: 18px;
        }
      }
      @container timer (min-height: 110px) {
        .timer-face {
          flex-direction: column;
          gap: 5px;
        }
        .timer-dial {
          width: 84px;
          height: 84px;
        }
        .timer-reading {
          align-items: center;
        }
      }
      @container note (min-width: 200px) {
        .note-copy {
          font-size: 16px;
          line-height: 22px;
        }
        .note-copy br {
          display: none;
        }
      }
      .change-layout:focus-visible {
        outline: 2px solid #121212;
        outline-offset: 3px;
      }
      .stage:not(.is-active) .micro-card {
        transition: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 420px) {
        .stage {
          padding-inline: 20px;
        }
        .heading {
          gap: 10px;
        }
        .micro-card {
          padding-inline: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      .stage {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 44px;
        padding: 56px 44px 28px;
        overflow: hidden;
      }
      .intro {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        gap: 20px;
      }
      .heading {
        display: block;
      }
      h1 {
        line-height: 1.15;
      }
      .layout-actions {
        flex-direction: column;
        align-items: flex-start;
        margin-top: 0;
        gap: 14px;
      }
      .board {
        height: 100%;
        min-height: 0;
        margin-top: 0;
      }
      .micro-card > :first-child {
        transform-origin: 0 0;
      }
      .micro-card.is-dragging {
        opacity: 0.4;
        box-shadow: none;
      }
      .drag-ghost {
        display: none;
        position: absolute;
        pointer-events: none;
        border: 2px dashed #0066d6;
        border-radius: 10px;
        background: #b5deff55;
        z-index: 5;
      }
      .board.is-dragging .drag-ghost {
        display: block;
      }
      .storage-status {
        min-height: 16px;
        color: #61788a;
        font-size: 12px;
        line-height: 16px;
      }
      @media (max-width: 930px) {
        .stage {
          grid-template-columns: 240px minmax(0, 1fr);
          gap: 28px;
          padding-inline: 32px;
        }
        h1 {
          font-size: 32px;
        }
      }
      @media (max-width: 700px) {
        .stage {
          min-height: 600px;
          height: auto;
          grid-template-columns: 1fr;
          grid-template-rows: auto 280px;
          padding: 52px 24px 24px;
          gap: 24px;
        }
        body {
          overflow: auto;
        }
        .intro {
          gap: 12px;
        }
        .layout-actions {
          flex-direction: row;
          align-items: center;
        }
        .storage-status:empty {
          display: none;
        }
        h1 br {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-labelledby="title">
      <section class="intro">
        <header class="heading">
          <h1 id="title">随心摆放 组合看板</h1>
        </header>
        <div class="layout-actions">
          <p class="layout-hint">换个布局试试</p>
          <button
            type="button"
            class="change-layout"
            id="changeLayout"
            aria-controls="board"
          >
            换个布局
          </button>
        </div>
        <p class="storage-status" id="storageStatus" role="status"></p>
      </section>
      <div
        class="board"
        id="board"
        role="group"
        aria-label="可自由组合的小看板"
      >
        <div
          class="micro-card chart"
          role="group"
          tabindex="0"
          aria-describedby="dragHelp"
          aria-label="趋势图示例，本周增长百分之十八点六"
        >
          <div class="chart-face">
            <div class="chart-metric">
              <strong class="chart-value">+18.6%</strong
              ><span class="chart-period">本周</span>
            </div>
            <svg
              class="chart-trend"
              viewBox="0 0 240 90"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <defs>
                <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#91d4ff" stop-opacity=".28" />
                  <stop offset="1" stop-color="#91d4ff" stop-opacity="0" />
                </linearGradient>
              </defs>
              <path
                d="M0 18H240M0 48H240M0 78H240"
                stroke="#ffffff16"
                fill="none"
                vector-effect="non-scaling-stroke"
              />
              <path
                d="M0 76 28 60 57 65 86 43 115 51 144 28 172 37 203 18 240 8V90H0Z"
                fill="url(#trendFill)"
              />
              <path
                d="M0 76 28 60 57 65 86 43 115 51 144 28 172 37 203 18 240 8"
                stroke="#91d4ff"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
                vector-effect="non-scaling-stroke"
              />
              <circle cx="203" cy="18" r="3" fill="#fff" />
            </svg>
            <div class="chart-axis"><span>周一</span><span>周五</span></div>
          </div>
        </div>
        <div
          class="micro-card timer"
          role="group"
          tabindex="0"
          aria-describedby="dragHelp"
          aria-label="刻度专注计时器示例，二十五分钟"
        >
          <div class="timer-face">
            <svg class="timer-dial" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="48" stroke="#1685ff25" fill="none" />
              <g stroke="#1685ff88" stroke-width="1">
                <line x1="50.00" y1="14.00" x2="50.00" y2="6.00" />
                <line x1="54.18" y1="10.22" x2="54.60" y2="6.24" />
                <line x1="58.32" y1="10.87" x2="59.15" y2="6.96" />
                <line x1="62.36" y1="11.96" x2="63.60" y2="8.15" />
                <line x1="66.27" y1="13.46" x2="67.90" y2="9.80" />
                <line x1="68.00" y1="18.82" x2="72.00" y2="11.89" />
                <line x1="73.51" y1="17.64" x2="75.86" y2="14.40" />
                <line x1="76.77" y1="20.27" x2="79.44" y2="17.30" />
                <line x1="79.73" y1="23.23" x2="82.70" y2="20.56" />
                <line x1="82.36" y1="26.49" x2="85.60" y2="24.14" />
                <line x1="81.18" y1="32.00" x2="88.11" y2="28.00" />
                <line x1="86.54" y1="33.73" x2="90.20" y2="32.10" />
                <line x1="88.04" y1="37.64" x2="91.85" y2="36.40" />

                <line x1="86.54" y1="66.27" x2="90.20" y2="67.90" />

              <circle
                cx="50"
                cy="50"
                r="28"

                fill="none"
              />
              <path
                d="M50 22A28 28 0 1 1 22 50"

            </svg>
            <div class="timer-reading">
              <strong class="timer-value">25:00</strong
              ><span class="timer-label">专注</span>
            </div>
          </div>
        </div>
        <div
          class="micro-card todo"
          role="group"
          tabindex="0"
          aria-describedby="dragHelp"
          aria-label="待办"
        >
          <div class="tasks">
            <label class="task">
              <input type="checkbox" checked /><span
                class="task-check"
                aria-hidden="true"
              ></span
              ><span class="task-text">整理灵感</span>
            </label>
            <label class="task">
              <input type="checkbox" /><span
                class="task-check"
                aria-hidden="true"
              ></span
              ><span class="task-text">回复邮件</span>
            </label>
            <label class="task">
              <input type="checkbox" /><span
                class="task-check"
                aria-hidden="true"
              ></span
              ><span class="task-text">收尾归档</span>
            </label>
          </div>
        </div>
        <div
          class="micro-card note"
          tabindex="0"
          aria-describedby="dragHelp"
          role="group"
          aria-label="灵感便笺示例"
        >
          <div class="note-face">
            <span class="note-kicker">灵感</span>
            <p class="note-copy">留点空白，<br />让想法发生。</p>
          </div>
        </div>
        <div class="drag-ghost" id="dragGhost" aria-hidden="true"></div>
      </div>
      <p class="sr-only" id="dragHelp">
        拖动卡片到另一张卡片上交换位置；聚焦卡片后也可用方向键交换。待办可点击勾选。
      </p>
      <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
    </main>
    <script>
      "use strict";
      (() => {
        const stage = document.querySelector(".stage");
        if (!stage) return;
        const copy = {
          names: ["趋势图", "专注计时", "待办", "灵感便笺"],
          loadError: "无法读取已保存的布局",
          saveError: "更改暂未保存",
          swapped: (a, b) => `${a}与${b}已交换位置。`,
          changed: (n) => `已切换到第 ${n} 种布局。`,
        };
        const board = document.getElementById("board");
        const changeLayout = document.getElementById("changeLayout");
        const announcement = document.getElementById("announcement");
        const storageStatus = document.getElementById("storageStatus");
        const cards = Array.from(document.querySelectorAll(".micro-card"));
        const todos = Array.from(
          board.querySelectorAll('input[type="checkbox"]'),
        );
        const ghost = document.getElementById("dragGhost");
        const files = window.DaimonWidget?.files;
        const stateFile = "workspace/compose-layout.json";
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        );
        const layoutAnimations = new Set();
        const layouts = [
          [
            [0, 0, 5, 6],
            [5, 0, 7, 3],
            [5, 3, 4, 3],
            [9, 3, 3, 3],
          ],
          [
            [0, 0, 8, 3],
            [8, 0, 4, 3],
            [0, 3, 4, 3],
            [4, 3, 8, 3],
          ],
          [
            [0, 0, 3, 6],
            [3, 0, 6, 6],
            [9, 0, 3, 3],
            [9, 3, 3, 3],
          ],
          [
            [0, 0, 12, 3],
            [0, 3, 3, 3],
            [3, 3, 6, 3],
            [9, 3, 3, 3],
          ],
        ];
        let slots = [0, 1, 2, 3],
          layoutIndex = 0,
          drag = null,
          ready = false,
          disposed = false,
          canSave = false;
        let writeQueue = Promise.resolve();
        const cleanup = [];
        function listen(target, type, handler, options) {
          target.addEventListener(type, handler, options);
          cleanup.push(() =>
            target.removeEventListener(type, handler, options),
          );
        }
        function validState(value) {
          return (
            value &&
            value.version === 1 &&
            Number.isInteger(value.layoutIndex) &&
            value.layoutIndex >= 0 &&
            value.layoutIndex < layouts.length &&
            Array.isArray(value.slots) &&
            value.slots.length === 4 &&
            new Set(value.slots).size === 4 &&
            value.slots.every((n) => Number.isInteger(n) && n >= 0 && n < 4) &&
            Array.isArray(value.todos) &&
            value.todos.length === 3 &&
            value.todos.every((v) => typeof v === "boolean")
          );
        }
        async function load() {
          if (typeof files?.readText !== "function") return;
          try {
            const text = await files.readText(stateFile);
            if (typeof text !== "string" || text.length > 10000)
              throw Error("invalid_state");
            const value = JSON.parse(text);
            if (!validState(value)) throw Error("invalid_state");
            if (disposed) return;
            slots = value.slots.slice();
            layoutIndex = value.layoutIndex;
            todos.forEach((input, i) => {
              input.checked = value.todos[i];
            });
            canSave = typeof files.writeText === "function";
          } catch (error) {
            if (["not_found", "file_not_found"].includes(error?.code))
              canSave = typeof files?.writeText === "function";
            else {
              canSave = false;
              if (!disposed) storageStatus.textContent = copy.loadError;
            }
          }
        }
        function persist() {
          const state = {
            version: 1,
            layoutIndex,
            slots: slots.slice(),
            todos: todos.map((input) => input.checked),
          };
          if (!ready || !validState(state)) return;
          if (!canSave) {
            storageStatus.textContent = copy.saveError;
            return;
          }
          const text = JSON.stringify(state);
          writeQueue = writeQueue.then(async () => {
            if (!canSave) return;
            try {
              await files.writeText(stateFile, text);
              if (!disposed) storageStatus.textContent = "";
            } catch {
              canSave = false;
              if (!disposed) storageStatus.textContent = copy.saveError;
            }
          });
        }
        const coordinate = (n, total) =>
          `calc(${(n / total) * 100}% + ${(n / total) * 8}px)`;
        const span = (n, total) =>
          `calc(${(n / total) * 100}% - ${(1 - n / total) * 8}px)`;
        function stopLayoutMotion() {
          for (const animation of layoutAnimations) animation.cancel();
          layoutAnimations.clear();
        }
        function animateLayout(element, frames) {
          const animation = element.animate(frames, {
            duration: 300,
            easing: "cubic-bezier(0.32, 0.72, 0, 1)",
          });
          layoutAnimations.add(animation);
          animation.onfinish = animation.oncancel = () =>
            layoutAnimations.delete(animation);
        }
        function render(animate = false) {
          const moving = animate && !reducedMotion.matches && !document.hidden;
          // Read before cancelling so a second click continues from the visible position.
          const before = moving
            ? cards.map((card) => card.getBoundingClientRect())
            : [];
          stopLayoutMotion();
          cards.forEach((card, index) => {
            const [x, y, w, h] = layouts[layoutIndex][slots[index]];
            card.style.left = coordinate(x, 12);
            card.style.top = coordinate(y, 6);
            card.style.width = span(w, 12);
            card.style.height = span(h, 6);
          });
          board.dataset.layout = String(layoutIndex + 1);
          if (!moving || !board.clientWidth || !board.clientHeight) return;
          const bounds = board.getBoundingClientRect();
          if (!bounds.width || !bounds.height) return;
          const scaleX = bounds.width / board.clientWidth;
          const scaleY = bounds.height / board.clientHeight;
          const after = cards.map((card) => card.getBoundingClientRect());
          cards.forEach((card, index) => {
            const first = before[index],
              last = after[index];
            if (!first.width || !first.height || !last.width || !last.height)
              return;
            const x = (first.left - last.left) / scaleX;
            const y = (first.top - last.top) / scaleY;
            const sx = first.width / last.width;
            const sy = first.height / last.height;
            if (
              Math.abs(x) + Math.abs(y) + Math.abs(sx - 1) + Math.abs(sy - 1) <
              0.01
            )
              return;
            animateLayout(card, [
              { transform: `translate(${x}px, ${y}px) scale(${sx}, ${sy})` },
              { transform: "translate(0, 0) scale(1, 1)" },
            ]);
            if (
              card.firstElementChild &&
              (Math.abs(sx - 1) > 0.001 || Math.abs(sy - 1) > 0.001)
            ) {
              // Counter-scale the contents: surfaces resize while text keeps its natural shape.
              // Sample the inverse curve so it tracks the parent's interpolated scale.
              animateLayout(
                card.firstElementChild,
                Array.from({ length: 33 }, (_, step) => {
                  const progress = step / 32;
                  return {
                    offset: progress,
                    transform: `scale(${1 / (sx + (1 - sx) * progress)}, ${1 / (sy + (1 - sy) * progress)})`,
                  };
                }),
              );
            }
          });
        }
        function slotRect(slot) {
          const [x, y, w, h] = layouts[layoutIndex][slot];
          return {
            x: (x / 12) * (board.clientWidth + 8),
            y: (y / 6) * (board.clientHeight + 8),
            w: (w / 12) * (board.clientWidth + 8) - 8,
            h: (h / 6) * (board.clientHeight + 8) - 8,
          };
        }
        function targetAt(clientX, clientY) {
          const bounds = board.getBoundingClientRect();
          if (!bounds.width || !bounds.height) return null;
          const x =
              ((clientX - bounds.left) * board.clientWidth) / bounds.width,
            y = ((clientY - bounds.top) * board.clientHeight) / bounds.height;
          if (x < 0 || x > board.clientWidth || y < 0 || y > board.clientHeight)
            return null;
          let target = null,
            nearest = Infinity;
          cards.forEach((_, index) => {
            const r = slotRect(slots[index]);
            const distance = Math.hypot(
              Math.max(r.x - x, 0, x - r.x - r.w),
              Math.max(r.y - y, 0, y - r.y - r.h),
            );
            if (distance < nearest) {
              nearest = distance;
              target = index;
            }
          });
          return target;
        }
        function showGhost(index) {
          const r = slotRect(slots[index]);
          ghost.style.left = r.x + "px";
          ghost.style.top = r.y + "px";
          ghost.style.width = r.w + "px";
          ghost.style.height = r.h + "px";
        }
        function swap(a, b) {
          [slots[a], slots[b]] = [slots[b], slots[a]];
          render(true);
          persist();
          announcement.textContent = copy.swapped(copy.names[a], copy.names[b]);
        }
        function finishDrag(commit) {
          if (!drag) return;
          const previous = drag;
          drag = null;
          const card = cards[previous.index];
          if (card.hasPointerCapture?.(previous.pointerId))
            card.releasePointerCapture(previous.pointerId);
          board.classList.remove("is-dragging");
          cards.forEach((card) =>
            card.classList.remove("is-dragging", "is-drop-target"),
          );
          if (
            commit &&
            previous.started &&
            previous.target !== null &&
            previous.target !== previous.index
          )
            swap(previous.index, previous.target);
        }
        function updateDrag(event) {
          if (!drag || event.pointerId !== drag.pointerId) return;
          if (
            !drag.started &&
            Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 6
          )
            return;
          drag.started = true;
          board.classList.add("is-dragging");
          cards[drag.index].classList.add("is-dragging");
          drag.target = targetAt(event.clientX, event.clientY);
          showGhost(drag.target ?? drag.index);
          cards.forEach((card, index) =>
            card.classList.toggle(
              "is-drop-target",
              index === drag.target && index !== drag.index,
            ),
          );
        }
        cards.forEach((card, index) => {
          listen(card, "pointerdown", (event) => {
            if (
              !ready ||
              disposed ||
              drag ||
              event.button !== 0 ||
              event.isPrimary === false ||
              event.target.closest(".task")
            )
              return;
            stopLayoutMotion();
            card.focus({ preventScroll: true });
            event.preventDefault();
            drag = {
              index,
              pointerId: event.pointerId,
              x: event.clientX,
              y: event.clientY,
              started: false,
              target: null,
            };
            card.setPointerCapture?.(event.pointerId);
          });
          listen(card, "lostpointercapture", (event) => {
            if (drag?.pointerId === event.pointerId && drag.index === index)
              finishDrag(false);
          });
          listen(card, "keydown", (event) => {
            if (
              !ready ||
              event.target !== card ||
              !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(
                event.key,
              )
            )
              return;
            event.preventDefault();
            if (drag) return;
            const from = slotRect(slots[index]),
              horizontal = ["ArrowLeft", "ArrowRight"].includes(event.key),
              sign = ["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 1;
            let target = null,
              score = Infinity;
            cards.forEach((_, candidate) => {
              if (candidate === index) return;
              const to = slotRect(slots[candidate]),
                dx = to.x + to.w / 2 - from.x - from.w / 2,
                dy = to.y + to.h / 2 - from.y - from.h / 2;
              const forward = (horizontal ? dx : dy) * sign,
                distance = forward + Math.abs(horizontal ? dy : dx) * 0.75;
              if (forward > 1 && distance < score) {
                target = candidate;
                score = distance;
              }
            });
            if (target !== null) swap(index, target);
          });
        });
        listen(window, "pointermove", updateDrag);
        listen(window, "pointerup", (event) => {
          if (drag?.pointerId === event.pointerId) {
            updateDrag(event);
            finishDrag(true);
          }
        });
        listen(window, "pointercancel", (event) => {
          if (drag?.pointerId === event.pointerId) finishDrag(false);
        });
        listen(window, "blur", () => finishDrag(false));
        listen(window, "resize", () => {
          finishDrag(false);
          stopLayoutMotion();
        });
        listen(reducedMotion, "change", () => {
          if (reducedMotion.matches) stopLayoutMotion();
        });
        listen(document, "visibilitychange", () => {
          if (document.hidden) {
            finishDrag(false);
            stopLayoutMotion();
          }
        });
        listen(document, "keydown", (event) => {
          if (event.key === "Escape" && drag) {
            event.preventDefault();
            finishDrag(false);
          }
        });
        listen(changeLayout, "click", () => {
          if (!ready) return;
          finishDrag(false);
          layoutIndex = (layoutIndex + 1) % layouts.length;
          render(true);
          persist();
          announcement.textContent = copy.changed(layoutIndex + 1);
        });
        todos.forEach((input) =>
          listen(input, "change", () => {
            if (ready) persist();
          }),
        );
        listen(window, "pagehide", () => {
          disposed = true;
          finishDrag(false);
          stopLayoutMotion();
          cleanup.forEach((remove) => remove());
        });
        changeLayout.disabled = true;
        todos.forEach((input) => {
          input.disabled = true;
        });
        stage.setAttribute("aria-busy", "true");
        render();
        load().then(() => {
          if (disposed) return;
          ready = true;
          changeLayout.disabled = false;
          todos.forEach((input) => {
            input.disabled = false;
          });
          stage.setAttribute("aria-busy", "false");
          render();
        });
      })();
    </script>
  </body>
</html>
