<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>让 Kimi 搭建你的专属看板</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #91d4ff;
      }
      body {
        font-family: var(
          --kimi-font-sans,
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          "MiSans",
          "Microsoft YaHei",
          sans-serif
        );
        color: #121212;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 160px;
        overflow: hidden;
        background: #91d4ff;
      }
      .el {
        position: absolute;
      }
      button {
        font-size: inherit;
        font-family: inherit;
      }

      h1.head {
        z-index: 2;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #121212;
        white-space: nowrap;
      }

      .hint {
        z-index: 2;
        font-size: 18px;
        line-height: 1.4;
        color: #62676d;
      }

      .notes {
        z-index: 2;
        display: flex;
        gap: 0.8em;
      }
      .note {
        position: relative;
        flex: 1;
        min-width: 0;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.45em;
        padding: 1em 1.05em;
        background: #007cff;
        border: none;
        border-radius: 0;
        color: #ffffff;
        font-family: inherit;
        overflow: hidden;
        transition:
          transform 0.14s cubic-bezier(0.3, 1.4, 0.5, 1),
          background 0.14s;
        animation: drift 9s ease-in-out infinite;
      }
      @keyframes drift {
        0% {
          translate: 0 0;
        }
        25% {
          translate: 3px -6px;
        }
        50% {
          translate: -2px -9px;
        }
        75% {
          translate: -4px -3px;
        }
        100% {
          translate: 0 0;
        }
      }
      .note:hover {
        transform: translateY(-2px);
        background: #0066d6;
      }
      .note:active {
        transform: scale(0.985);
      }
      .note .who {
        font-size: 1em;
        font-weight: 600;
        letter-spacing: 0.04em;
        white-space: nowrap;
        line-height: 1.25;
      }
      .note .what {
        flex: 1;
        font-size: 1em;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.92);
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: var(--clamp, 8);
      }
      .note .what .kw {
        font-weight: 700;
        color: #d9edff;
      }

      .note.dark {
        background: #002e58;
        color: #ffffff;
      }
      .note.dark:hover {
        background: #002e58;
      }
      .note.dark .what {
        color: rgba(255, 255, 255, 0.92);
      }
      .note.dark .what .kw {
        color: #91d4ff;
      }
      .note .ok {
        position: absolute;
        top: 0;
        right: 0;
        padding: 0.25em 0.7em;
        background: #ffffff;
        color: #007cff;
        font-size: 0.78em;
        font-weight: 600;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 0.15s,
          transform 0.15s;
        pointer-events: none;
        z-index: 3;
      }
      .note.dark .ok {
        background: #ffffff;
        color: #002e58;
      }

      .note.light {
        background: #ffffff;
        color: #121212;
      }
      .note.light:hover {
        background: #eff8ff;
      }
      .note.light .who::before {
        background: #007cff;
      }
      .note.light .who .num {
        color: rgba(18, 18, 18, 0.5);
      }
      .note.light .what {
        color: rgba(18, 18, 18, 0.9);
      }
      .note.light .what .kw {
        color: #007cff;
      }
      .note.light .ok {
        background: #002e58;
        color: #ffffff;
      }
      .note.copied .ok {
        opacity: 1;
        transform: translateY(0);
      }

      .field {
        z-index: 0;
        overflow: hidden;
        cursor: crosshair;
      }
      .field canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      @media (prefers-reduced-motion: reduce) {
        .note {
          transition: none;
          animation: none;
        }
        .note .ok {
          transition: none;
        }
      }

      html,
      body,
      .stage {
        background: #f5f6f7;
      }
      .note {
        color: #121212;
      }
      .note:nth-child(1),
      .note:nth-child(1):hover {
        background: #c5e1ec;
      }
      .note:nth-child(2),
      .note:nth-child(2):hover {
        background: #6fb9da;
      }
      .note:nth-child(3),
      .note:nth-child(3):hover {
        background: #6fa1d3;
      }
      .note:nth-child(4),
      .note:nth-child(4):hover {
        background: #ffffff;
      }
      .note:nth-child(5),
      .note:nth-child(5):hover {
        background: #cde5ee;
      }
      .note .who {
        color: #121212;
      }
      .note .what,
      .note.light .what,
      .note.dark .what {
        color: #121212 !important;
      }
      .note .what .kw,
      .note.light .what .kw,
      .note.dark .what .kw {
        color: #121212 !important;
        font-weight: 700;
      }
      .note .what,
      .note .what .kw {
        color: #515151 !important;
      }
      .note .ok,
      .note.light .ok,
      .note.dark .ok {
        background: #ffffff !important;
        color: #121212 !important;
      }
      .note.copied .ok {
        opacity: 1;
        transform: translateY(0);
      }

      h1.head {
        font-size: 36px !important;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: 0;
      }
      .note .ok {
        font-size: 12px;
        line-height: 1.4;
      }
      body > :first-child {
        border: none !important;
        outline: none !important;
      }

      .note .what {
        min-height: 0;
        display: block;
        -webkit-line-clamp: unset;
      }
      .note {
        animation-play-state: paused;
      }
      .stage.is-active .note {
        animation-play-state: running;
      }
      .note:focus-visible {
        outline: 2px solid #0066d6;
        outline-offset: 3px;
      }
      .detail-mask {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(2px);
      }
      .detail-mask[hidden] {
        display: none;
      }
      .detail-card {
        width: min(72%, 560px);
        max-height: 82%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 22px 24px;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.09);
        box-shadow: 0 12px 32px rgba(15, 35, 60, 0.18);
      }
      .detail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .detail-head strong {
        font-size: 18px;
        font-weight: 800;
      }
      .detail-close {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: background var(--t-fast, 120ms) ease-out;
      }
      .detail-close:hover {
        background: rgba(0, 0, 0, 0.1);
      }
      .detail-close svg {
        width: 16px;
        height: 16px;
      }
      .detail-prompt {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 14px 16px;
        border-radius: 8px;
        background: #f5f8fc;
        font-size: 14px;
        line-height: 1.65;
        color: rgba(0, 0, 0, 0.82);
      }
      .detail-create {
        flex: none;
        min-height: 40px;
        border: none;
        border-radius: 20px;
        background: #007cff;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .detail-create:hover {
        background: #0066d6 !important;
      }
      .detail-create.is-used,
      .detail-create.is-used:hover {
        background: #a8d4f5 !important;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="让 Kimi 搭建你的专属看板">
      <div class="el field" id="field" aria-hidden="true">
        <canvas></canvas>
      </div>
      <h1 class="el head">让 Kimi 搭建你的专属看板</h1>
      <p class="el hint">点击卡片查看咒语，一键创建同款看板</p>
      <div class="el notes" id="notes"></div>
      <div class="detail-mask" id="detail-mask" hidden>
        <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
          <div class="detail-head">
            <strong id="detail-title"></strong>
            <button type="button" class="detail-close" id="detail-close" aria-label="关闭">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 3 L13 13 M13 3 L3 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="detail-prompt" id="detail-prompt"></p>
          <button type="button" class="detail-create" id="detail-create">创建看板</button>
        </div>
      </div>
    </main>

    <script>
      (() => {
        if (!document.querySelector(".stage")) return;

        ("use strict");
        const FAMS = ["-+/", "()*", "▲K#⬢"];
        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        let REDUCED = motion.matches;
        let inView = true,
          disposed = false;
        const stageElement = document.querySelector(".stage");
        function cellHash(a, b) {
          let h =
            (Math.imul(a + 1, 374761393) + Math.imul(b + 1, 668265263)) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }
        let FCELL = 18;
        const fState = {
          on: false,
          ctx: null,
          w: 0,
          h: 0,
          cols: 0,
          rows: 0,
          offX: 0,
          offY: 0,
          holes: [],
        };
        const P = { x: -1e4, y: -1e4, t: -1e4 };
        function setupField(w, h) {
          const cv = document.querySelector(".field canvas");
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          cv.width = Math.max(1, Math.round(w * dpr));
          cv.height = Math.max(1, Math.round(h * dpr));
          const ctx = cv.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          fState.ctx = ctx;
          fState.w = w;
          fState.h = h;
          FCELL = clamp(Math.round(h / 18), 12, 20);
          fState.cols = Math.ceil(w / FCELL);
          fState.rows = Math.max(1, Math.floor(h / FCELL));
          fState.offX = (w - fState.cols * FCELL) / 2;
          fState.offY = (h - fState.rows * FCELL) / 2;
          fState.on = true;
        }
        function holeFactor(x, y) {
          let f = 1;
          const hs = fState.holes;
          for (let i = 0; i < hs.length; i++) {
            const ho = hs[i];
            const dx = Math.max(ho.x - x, 0, x - (ho.x + ho.w));
            const dy = Math.max(ho.y - y, 0, y - (ho.y + ho.h));
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ho.feather) f *= 1 - ho.f + ho.f * (dist / ho.feather);
          }
          return f;
        }
        function drawField(t) {
          if (!fState.on) return;
          const { ctx, w, h, cols, rows, offX, offY } = fState;
          ctx.clearRect(0, 0, w, h);
          const breathe = 0.85 + 0.25 * Math.sin(t * 0.14 + 1);
          let rip = null;
          const dt = t - P.t;
          if (dt >= 0 && dt < 1.5) {
            const sig = FCELL * 2.6;
            rip = {
              amp: 0.55 * Math.exp(-dt * 2.0),
              phase: dt * 9,
              s2: 2 * sig * sig,
            };
          }
          const zb1 = cols / 3,
            zb2 = (2 * cols) / 3;
          const buckets = [[], []];
          for (let r = 0; r < rows; r++) {
            const y = offY + r * FCELL + FCELL / 2;
            for (let c = 0; c < cols; c++) {
              const reg =
                c < zb1 + Math.sin(r * 0.4 + t * 0.15) * 1.5
                  ? 0
                  : c < zb2 + Math.sin(r * 0.35 - t * 0.12 + 2) * 1.5
                    ? 1
                    : 2;
              const x = offX + c * FCELL + FCELL / 2;
              let d =
                0.52 +
                (0.24 * Math.sin(r * 0.55 - t * 0.5 + reg * 2.1) +
                  0.12 * Math.sin(c * 0.09 + t * 0.23)) *
                  breathe +
                (cellHash(c * 5 + reg, r * 3 + 1) - 0.5) * 0.14;
              if (rip) {
                const dx = x - P.x,
                  dy = y - P.y;
                const q = (dx * dx + dy * dy) / rip.s2;
                if (q < 9)
                  d +=
                    rip.amp *
                    Math.exp(-q) *
                    Math.cos(rip.phase - Math.sqrt(q) * 3);
              }
              d *= holeFactor(x, y);
              d = Math.max(0, Math.min(1, d));
              if (d < 0.3) continue;
              const fam = FAMS[reg];
              const ch =
                fam[
                  Math.min(
                    fam.length - 1,
                    Math.floor(((d - 0.3) / 0.7) * fam.length),
                  )
                ];
              buckets[cellHash(c, r) < 0.5 ? 0 : 1].push(
                x,
                y,
                ch,
                d < 0.5 ? "#91D4FF" : d < 0.72 ? "#00A1FF" : "#007CFF",
              );
            }
          }
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const sizes = [Math.max(12, FCELL * 0.8), Math.max(12, FCELL * 0.62)];
          for (let b = 0; b < 2; b++) {
            ctx.font =
              sizes[b] + 'px Menlo, "SF Mono", "DejaVu Sans Mono", monospace';
            const a = buckets[b];
            for (let i = 0; i < a.length; i += 4) {
              ctx.fillStyle = a[i + 3];
              ctx.fillText(a[i + 2], a[i], a[i + 1] + sizes[b] * 0.03);
            }
          }
        }
        let raf = 0,
          lastF = 0;
        function loop(now) {
          raf = requestAnimationFrame(loop);
          if (now - lastF < 66) return;
          lastF = now;
          drawField(now / 1000);
        }
        function startLoop() {
          if (
            !raf &&
            !REDUCED &&
            _tFix === null &&
            !document.hidden &&
            inView &&
            !disposed
          )
            raf = requestAnimationFrame(loop);
        }
        function stopLoop() {
          if (raf) {
            cancelAnimationFrame(raf);
            raf = 0;
          }
        }
        function syncActivity() {
          const active = !disposed && inView && !document.hidden && !REDUCED;
          stageElement.classList.toggle("is-active", active);
          if (active) startLoop();
          else stopLoop();
        }
        document.addEventListener("visibilitychange", syncActivity);
        const fieldObserver =
          typeof IntersectionObserver === "function"
            ? new IntersectionObserver((entries) => {
                inView = entries[0]?.isIntersecting ?? true;
                syncActivity();
              })
            : null;
        fieldObserver?.observe(stageElement);
        function onMotionChange() {
          REDUCED = motion.matches;
          syncActivity();
          if (REDUCED) drawField(0.7);
        }
        motion.addEventListener?.("change", onMotionChange);
        const fieldEl = document.getElementById("field");
        fieldEl.addEventListener(
          "pointermove",
          (e) => {
            if (REDUCED) return;
            const rc = fieldEl.getBoundingClientRect();
            P.x = e.clientX - rc.left;
            P.y = e.clientY - rc.top;
            P.t = performance.now() / 1000;
          },
          { passive: true },
        );
        const HEAD = "让 Kimi 搭建你的专属看板";
        const FF = getComputedStyle(document.body).fontFamily;
        const mc = document.createElement("canvas").getContext("2d");
        const tw = (s, fs, w) => {
          mc.font = `${w} ${fs}px ${FF}`;
          return mc.measureText(s).width;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        function pickCols(W, H) {
          const a = W / H;
          if (a >= 2.6) return { n: 10, vert: false };
          if (a >= 2.1) return { n: 8, vert: false };
          if (a >= 1.55) return { n: 6, vert: false };
          if (a >= 1.15) return { n: 4, vert: false };
          return { n: 5, vert: true };
        }
        function gridMetrics(W, H, n) {
          const mx = 0.05 * W,
            my = 0.05 * H,
            g = 0.01 * W;
          const iw = W - 2 * mx,
            ih = H - 2 * my;
          const sCols = (iw - (n - 1) * g) / n;
          const m = Math.max(1, Math.round((ih + g) / (sCols + g)));
          const sRows = (ih - (m - 1) * g) / m;
          const s = Math.min(sCols, sRows);
          const ox = mx + (iw - n * s - (n - 1) * g) / 2;
          const oy = my + (ih - m * s - (m - 1) * g) / 2;
          return { n, m, s, g, ox, oy };
        }
        function zones(n, m, vert) {
          if (vert)
            return {
              head: [0, 0, 5, 1],
              notes: [0, 1, 5, m - 1],
            };
          if (m < 3 || n <= 4)
            return {
              head: [0, 0, n, 1],
              notes: [0, 1, n, m - 1],
            };
          const headC = Math.min(n - 1, Math.max(5, Math.round(n * 0.6)));
          return {
            head: [0, 0, headC, 1],
            notes: [0, 1, n, m - 1],
          };
        }
        const $ = (s) => document.querySelector(s);
        function layout() {
          const stage = $(".stage");
          const W = stage.clientWidth,
            H = stage.clientHeight;
          if (!W || !H) return;
          const { n, vert } = pickCols(W, H);
          const gm = gridMetrics(W, H, n);
          const z = zones(n, gm.m, vert);
          const { s, g, ox, oy } = gm;
          const X = (i) => ox + i * (s + g);
          const Y = (j) => oy + j * (s + g);
          const rect = ([i, j, cs, rs]) => ({
            x: X(i),
            y: Y(j),
            w: cs * s + (cs - 1) * g,
            h: rs * s + (rs - 1) * g,
          });
          const hr = rect(z.head);
          const headFs = 36;
          const head = $(".head");
          head.style.fontSize = headFs + "px";
          head.style.left = hr.x + "px";
          head.style.top = hr.y + (hr.h - headFs) / 2 + "px";
          const hint = $(".hint");
          hint.style.left = hr.x + "px";
          hint.style.top = head.offsetTop + head.offsetHeight + 10 + "px";
          hint.style.width = W - 2 * hr.x + "px";
          const nr = rect(z.notes);
          const notesTop = Math.max(
            nr.y,
            hint.offsetTop + hint.offsetHeight + 24,
          );
          nr.h = Math.max(0, nr.h - (notesTop - nr.y));
          nr.y = notesTop;
          const notes = $("#notes");
          notes.style.left = nr.x + "px";
          notes.style.top = nr.y + "px";
          notes.style.width = nr.w + "px";
          notes.style.height = nr.h + "px";
          notes.style.flexDirection = vert ? "column" : "row";
          const MAXCH = 52;
          let nfs = 26;
          for (; nfs > 12; nfs -= 0.5) {
            const gp = 0.8 * nfs;
            const noteW = vert ? nr.w : (nr.w - 4 * gp) / 5;
            const noteH = vert ? (nr.h - 4 * gp) / 5 : nr.h;
            const cpl = Math.max(1, Math.floor((noteW - 2.1 * nfs) / nfs));
            const lines = Math.floor((noteH - nfs * 3.7) / (nfs * 1.5));
            if (lines >= 2 && cpl * lines >= MAXCH) break;
          }
          notes.style.fontSize = nfs + "px";
          // Fit the actual localized text, including longer English words.
          while (
            nfs > 13.5 &&
            [...notes.querySelectorAll(".what")].some(
              (el) => el.scrollHeight > el.clientHeight + 1,
            )
          ) {
            nfs -= 0.5;
            notes.style.fontSize = nfs + "px";
          }
          const noteH2 = vert ? (nr.h - 4 * 0.8 * nfs) / 5 : nr.h;
          notes.style.setProperty(
            "--clamp",
            Math.max(2, Math.floor((noteH2 - nfs * 3.7) / (nfs * 1.5))),
          );
          const fe = $("#field");
          fe.style.left = "0px";
          fe.style.top = "0px";
          fe.style.width = W + "px";
          fe.style.height = H + "px";
          setupField(W, H);
          const pad = 0.5 * FCELL,
            feather = 1.6 * FCELL;
          const holes = [
            {
              x: hr.x - pad,
              y: hr.y - pad,
              w: hr.w + 2 * pad,
              h: hr.h + 2 * pad,
              f: 1,
              feather: feather,
            },
          ];
          holes.push({
            x: hint.offsetLeft - pad,
            y: hint.offsetTop - pad,
            w:
              Math.min(hint.offsetWidth, tw(hint.textContent, 18, 400)) +
              2 * pad,
            h: hint.offsetHeight + 2 * pad,
            f: 1,
            feather: feather,
          });
          fState.holes = holes;
          drawField(_tFix !== null ? _tFix : performance.now() / 1000);
        }
        const _tFix = null;
        window.addEventListener("resize", layout);
        const resizeObserver = new ResizeObserver(layout);
        resizeObserver.observe(document.querySelector(".stage"));
        (document.fonts && document.fonts.ready
          ? document.fonts.ready
          : Promise.resolve()
        ).then(() => {
          layout();
          if (disposed) return;
        });
        (function () {
          "use strict";
          var SPELLS = [
            {
              key: "stock-watch",
              who: "盯盘",
              light: true,
              what: "帮我做一个自选股盯盘 widget 放到画布上：关注茅台、五粮液和苹果，每个交易日收盘后自动抓收盘价和涨跌幅刷新",
            },
            {
              key: "pomodoro",
              who: "番茄钟",
              what: "做一个番茄钟组件：25 分钟专注 + 5 分钟休息，能开始 / 暂停 / 重置，今天完成几轮记在组件里",
            },
            {
              key: "todo-habit",
              who: "待办打卡",
              dark: true,
              what: "来一张待办 + 习惯打卡 widget：待办可增删勾选，习惯显示最近 7 天格子，数据存我本地不丢",
            },
            {
              key: "daily-briefing",
              who: "每日简报",
              light: true,
              what: "建一个每日 AI 新闻简报 widget，配一个每天早 8 点的定时任务：先给 3 条核心摘要和为什么重要，再列来源链接",
            },
            {
              key: "music-player",
              who: "播放器",
              what: "做一个本地音乐播放器 widget：扫描我曲库里的歌生成列表，支持播放 / 暂停 / 切歌和进度条",
            },
          ];
          var NOTE_COLORS = [
            "#C5E1EC",
            "#6FB9DA",
            "#6FA1D3",
            "#FFFFFF",
            "#CDE5EE",
          ];
          for (var ci = NOTE_COLORS.length - 1; ci > 0; ci--) {
            var cj = Math.floor(Math.random() * (ci + 1));
            var tmp = NOTE_COLORS[ci];
            NOTE_COLORS[ci] = NOTE_COLORS[cj];
            NOTE_COLORS[cj] = tmp;
          }
          var KW = /(widget|组件|定时任务)/g;
          var box = document.getElementById("notes");
          SPELLS.forEach(function (s, i) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "note" + (s.dark ? " dark" : s.light ? " light" : "");
            b.style.background = NOTE_COLORS[i % NOTE_COLORS.length];
            b.style.animationDuration = 8.5 + i * 1.4 + "s";
            b.style.animationDelay = -i * 2.3 + "s";
            var html = s.what
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(KW, '<span class="kw">$1</span>');
            b.innerHTML =
              '<span class="who">' +
              s.who +
              "</span>" +
              '<span class="what">' +
              html +
              "</span>" +
              '<span class="ok">已复制 ✓</span>';
            b.setAttribute("aria-label", s.who + ": " + s.what);
            b.querySelector(".ok").setAttribute("aria-hidden", "true");
            b.addEventListener("click", function () {
              openDetail(s);
              return;
              var badge = b.querySelector(".ok");
              var done = function () {
                badge.setAttribute("aria-hidden", "false");
                badge.textContent = "已复制 ✓";
                b.classList.remove("copied");
                void b.offsetWidth;
                b.classList.add("copied");
                setTimeout(function () {
                  b.classList.remove("copied");
                  badge.setAttribute("aria-hidden", "true");
                }, 1600);
              };
              var failed = function () {
                var range = document.createRange();
                range.selectNodeContents(b.querySelector(".what"));
                var selection = window.getSelection();
                selection?.removeAllRanges();
                selection?.addRange(range);
                badge.setAttribute("aria-hidden", "false");
                badge.textContent = "请选中文字后复制";
                b.classList.add("copied");
              };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(s.what).then(done, failed);
              } else {
                failed();
              }
            });
            box.appendChild(b);
          });
          var detailMask = document.getElementById("detail-mask"),
            detailTitle = document.getElementById("detail-title"),
            detailPrompt = document.getElementById("detail-prompt"),
            detailCreate = document.getElementById("detail-create"),
            detailClose = document.getElementById("detail-close"),
            currentSpell = null;
          function openDetail(s) {
            currentSpell = s;
            detailTitle.textContent = s.who;
            detailPrompt.textContent = s.what;
            detailMask.hidden = false;
          }
          function closeDetail() {
            currentSpell = null;
            detailMask.hidden = true;
          }
          detailClose.addEventListener("click", closeDetail);
          detailMask.addEventListener("click", function (event) {
            if (event.target === detailMask) closeDetail();
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !detailMask.hidden) closeDetail();
          });
          detailCreate.addEventListener("click", function () {
            if (!currentSpell) return;
            var host = globalThis.DaimonCanvas;
            if (host && typeof host.createCanvasWithPrompt === "function") {
              try {
                var p = host.createCanvasWithPrompt({
                  promptKey: currentSpell.key,
                  prompt: currentSpell.what,
                });
                if (p && typeof p.then === "function")
                  p.then(function (ok) {
                    if (ok) detailCreate.classList.add("is-used");
                  }, function () {});
              } catch (e) {}
              return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(currentSpell.what).then(closeDetail, closeDetail);
            }
          });
        })();
        layout();
        if (REDUCED) drawField(0.7);
        syncActivity();
        window.addEventListener(
          "pagehide",
          () => {
            disposed = true;
            stopLoop();
            stageElement.classList.remove("is-active");
            fieldObserver?.disconnect();
            resizeObserver.disconnect();
            window.removeEventListener("resize", layout);
            document.removeEventListener("visibilitychange", syncActivity);
            motion.removeEventListener?.("change", onMotionChange);
          },
          { once: true },
        );
      })();
    </script>
  </body>
</html>
