<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>来点酷的</title>
    <style>
      :root {
        --ink: #000;
        --muted: rgba(0, 0, 0, 0.5);
        --line: rgba(0, 0, 0, 0.09);
        --blue: var(--kimi-color-accent, #007cff);
        --radius: var(--kimi-radius-panel, 12px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: transparent;
        overflow: hidden;
        font-family: var(
          --kimi-font-sans,
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          "MiSans",
          "Microsoft YaHei",
          sans-serif
        );
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
      }
      .card {
        position: relative;
        isolation: isolate;
        container-type: size;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: var(--radius);
        background: #ffffff;
      }
      /* 每个模板一套卡片主题 */
      .card-efficiency {
        background: #f5f9ff;
      }
      .card-about {
        background: #f5f5f5;
      }

      /* ---- 常态：迷你组件扑克牌 ---- */
      .pane-crop {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 16px 16px 12px;
      }
      .head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        margin-bottom: 10px;
        padding-left: 4px;
      }
      h1 {
        margin: 0;
        min-width: 0;
        font-size: 20px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      h1::before {
        content: "";
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 2.5px;
        background: var(--accent, #007cff);
      }
      .card-example h1::before {
        background: #f0334b;
      }
      .card-efficiency h1::before {
        background: #007cff;
      }
      .card-about h1::before {
        background: #111111;
      }
      .card-cool h1::before {
        background: #9d7bff;
      }
      .desc {
        flex: none;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .crop {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f5f6f7;
        cursor: pointer;
        transition: border-color var(--t-normal, 200ms) var(--ease-out, ease-out);
      }
      .crop:hover {
        border-color: rgba(71, 130, 183, 0.4);
      }
      /* 每个模板一套主题背景 */
      .crop-efficiency {
        background: #eef5fd;
      }
      .crop-about {
        background: #ececec;
      }
      /* 三张迷你组件牌扇形叠放 */
      .mini {
        position: absolute;
        top: 4%;
        width: 76%;
        height: 92%;
        display: flex;
        flex-direction: column;
        gap: 4%;
        padding: 6% 7%;
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 0 0 1px rgba(15, 35, 60, 0.16);
        transition: transform var(--t-normal, 200ms) var(--ease-out, ease-out);
      }
      .mini.dark {
        background: #0d1117;
        color: #e6edf3;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .mini.pomo {
        background: #91d4ff;
        border-color: rgba(0, 0, 0, 0.06);
      }
      .card-l {
        left: -3%;
        transform: rotate(-7deg);
        z-index: 1;
      }
      .card-m {
        left: 12%;
        z-index: 3;
      }
      .card-r {
        right: -3%;
        transform: rotate(7deg);
        z-index: 2;
      }
      .card:hover .card-l {
        transform: rotate(-10deg) translateX(-5%);
      }
      .card:hover .card-r {
        transform: rotate(10deg) translateX(5%);
      }

      /* 迷你组件内部元素 */
      .mini-title {
        font-size: 13px;
        font-weight: 800;
        line-height: 1.2;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px;
      }
      .mini-title em {
        font-style: normal;
        font-weight: 500;
        font-size: 10px;
        color: var(--muted);
      }
      .light-t {
        color: #f0f3f6;
      }
      .dark-t {
        color: rgba(0, 0, 0, 0.55);
      }
      .mini-sub {
        font-size: 9.5px;
        line-height: 1.35;
        color: var(--muted);
      }
      .mini.dark .mini-sub,
      .mini.dark .mini-sub.light-t {
        color: rgba(230, 237, 243, 0.55);
      }
      .mini-cap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        opacity: 0.75;
      }
      .mini-cap .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #f0334b;
      }

      /* K 线 */
      .mini-tabs {
        display: flex;
        gap: 4px;
      }
      .mini-tabs i {
        font-style: normal;
        font-size: 8.5px;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(230, 237, 243, 0.6);
        white-space: nowrap;
      }
      .mini-tabs i.on {
        background: #e6edf3;
        color: #0d1117;
        border-color: transparent;
        font-weight: 700;
      }
      .kline {
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      .vol {
        display: flex;
        align-items: flex-end;
        gap: 4%;
        height: 14%;
      }
      .vol i {
        flex: 1;
        background: rgba(14, 203, 129, 0.55);
        border-radius: 1px;
      }
      .vol i:nth-child(2n) {
        background: rgba(240, 51, 75, 0.55);
      }

      /* 市场脉搏时钟 */
      .clock {
        flex: 1;
        display: flex;
        align-items: center;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      /* 热力图 */
      .heat {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        align-content: center;
      }
      .heat i {
        aspect-ratio: 1;
        border-radius: 2.5px;
      }
      .heat .up {
        background: #f0334b;
      }
      .heat .down {
        background: #0ecb81;
      }

      /* 番茄钟 */
      .pomo-ring {
        flex: 1;
        align-self: center;
        aspect-ratio: 1;
        max-height: 100%;
        border-radius: 50%;
        border: 5px solid rgba(13, 17, 23, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pomo-ring span {
        font-size: 17px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .pomo-btns {
        display: flex;
        gap: 6px;
      }
      .pomo-btns i {
        flex: 1;
        font-style: normal;
        font-size: 9px;
        font-weight: 600;
        text-align: center;
        padding: 4px 0;
        border-radius: 9px;
        background: #0d1117;
        color: #fff;
      }

      /* 待办 */
      .todo-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        line-height: 1.3;
      }
      .todo-row .cb {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid rgba(0, 0, 0, 0.25);
      }
      .todo-row span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 习惯打卡 */
      .habit-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 2.2em repeat(7, 1fr);
        gap: 3px;
        align-content: center;
        font-size: 8.5px;
      }
      .habit-grid b {
        font-weight: 500;
        color: var(--muted);
        text-align: center;
      }
      .habit-row {
        display: contents;
      }
      .habit-row span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .habit-row i {
        border-radius: 2.5px;
        border: 1px solid rgba(0, 0, 0, 0.14);
      }

      /* 视频卡（底图 + 浮层） */
      .mini-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mini-photo.k3 {
        object-position: center bottom;
      }
      .on-photo {
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      }
      .on-photo.top {
        flex: none;
      }
      .on-photo.bottom {
        flex: none;
      }
      .play-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .play-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .play-btn::after {
        content: "";
        margin-left: 2px;
        border-left: 10px solid #0d1117;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
      }

      /* 博客列表 */
      .blog-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
      }
      .blog-row .thumb {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        flex: none;
      }
      .blog-row .t1 {
        background: linear-gradient(135deg, #2b3a4a, #0d1117);
      }
      .blog-row .t2 {
        background: linear-gradient(135deg, #6baee8, #2b5a8a);
      }
      .blog-row b {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 博客大图 */
      .feature-img {
        position: relative;
        flex: 1;
        border-radius: 6px;
        background:
          radial-gradient(circle at 30% 25%, #3a4a6a, transparent 55%),
          radial-gradient(circle at 75% 80%, #1a2a4a, transparent 50%),
          #0d1117;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 8%;
        overflow: hidden;
      }
      .feature-img .latest {
        position: absolute;
        top: 7%;
        left: 8%;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #91d4ff;
      }
      .feature-img b {
        color: #f0f3f6;
        font-size: 13px;
        line-height: 1.25;
      }

      /* 播放器 */
      .vinyl-row {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 7%;
      }
      .vinyl {
        flex: none;
        width: 42%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: repeating-radial-gradient(
          circle,
          #1c2530 0 2.5px,
          #10151c 2.5px 5px
        );
        border: 1px solid rgba(255, 255, 255, 0.14);
        position: relative;
      }
      .vinyl::after {
        content: "";
        position: absolute;
        inset: 36%;
        border-radius: 50%;
        background: #91d4ff;
      }
      .vinyl-meta {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .vinyl-meta b {
        font-size: 10.5px;
        line-height: 1.25;
      }
      .vinyl-meta span {
        font-size: 8.5px;
        opacity: 0.55;
      }
      .progress {
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .progress i {
        display: block;
        width: 38%;
        height: 100%;
        background: #91d4ff;
      }

      /* 节拍器 */
      .beat-grid {
        position: relative;
        flex: 1;
        border-radius: 4px;
        background-image: radial-gradient(
          circle,
          rgba(145, 212, 255, 0.35) 1px,
          transparent 1.4px
        );
        background-size: 9px 9px;
      }
      .beat-grid i {
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: #91d4ff;
      }
      .beat-grid .b1 { left: 9px; top: 9px; }
      .beat-grid .b2 { left: 36px; top: 18px; }
      .beat-grid .b3 { left: 63px; top: 9px; }
      .beat-grid .b4 { left: 18px; top: 36px; }
      .beat-grid .b5 { left: 54px; top: 45px; }

      /* 历史上的今天 */
      .today-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 9.5px;
        line-height: 1.3;
      }
      .today-row i {
        flex: none;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #91d4ff;
      }
      .today-row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---- 全屏：完整预览 + 添加按钮 ---- */
      .pane-full {
        display: none;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 26px 30px 22px;
      }
      .full-shot {
        flex: 1;
        min-height: 0;
        width: 100%;
        object-fit: contain;
      }
      .full-foot {
        flex: none;
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 260px;
        min-height: 44px;
        padding: 0 26px;
        border-radius: 22px;
        border: 1px solid transparent;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        transition:
          background var(--t-fast, 120ms) ease-out,
          transform var(--t-fast, 120ms) ease-out;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .btn-primary {
        background: var(--blue);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--kimi-color-accent-hover, #0066d6) !important;
      }

      /* 容器够宽 = 全屏态（Desktop 全屏按钮放大 iframe 后自动切换） */
      @container (min-width: 720px) {
        .card {
          background: #ffffff;
        }
        .pane-crop {
          display: none;
        }
        .pane-full {
          display: flex;
        }
      }
      @container (max-width: 380px) {
        .pane-crop {
          padding: 12px 10px 8px;
        }
        h1 {
          font-size: 16px;
        }
        .desc {
          -webkit-line-clamp: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card card-cool" data-target-key="cool">
      <section class="pane pane-crop">
        <header class="head">
          <h1>来点酷的</h1>
        </header>
        <div class="crop js-crop crop-cool" role="button" tabindex="0" aria-label="点这里展开">
          <div class="mini dark card-l">

      <div class="beat-grid"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
      <div class="mini-sub light-t">DILLA TIME · SWING 41%</div></div>
          <div class="mini dark card-r">
      <div class="mini-cap"><span>历史上的今天</span><i class="dot"></i></div>
      <div class="today-row"><i></i><span>英格兰国王爱德华二世逝世</span></div><div class="today-row"><i></i><span>第26任澳大利亚总理陆克文出生</span></div><div class="today-row"><i></i><span>美国作家史蒂芬金出生</span></div></div>
          <div class="mini dark card-m">

      <div class="progress"><i></i></div></div>
        </div>

    <script>
      (() => {
        const card = document.querySelector(".card");
        if (!card) return;
        const targetKey = card.getAttribute("data-target-key");
        const addBtn = card.querySelector(".js-add");
        const crop = card.querySelector(".js-crop");
        const expand = () => {
          const host = globalThis.DaimonCanvas;
          if (!host || typeof host.expand !== "function") return;
          try {
            const result = host.expand();
            if (result && typeof result.catch === "function")
              result.catch(() => {});
          } catch {}
        };
        crop.addEventListener("click", expand);
        crop.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            expand();
          }
        });
        addBtn.addEventListener("click", () => {
          const host = globalThis.DaimonCanvas;
          if (!host || typeof host.openCanvas !== "function") return;
          try {
            const result = host.openCanvas({ targetKey });
            if (result && typeof result.catch === "function")
              result.catch(() => {});
          } catch {}
        });
      })();
    </script>
