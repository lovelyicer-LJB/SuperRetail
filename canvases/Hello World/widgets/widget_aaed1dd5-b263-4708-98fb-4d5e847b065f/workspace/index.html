<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  .stage {
    position: relative; width: 100%; height: 100%;
    background: #91D4FF; overflow: hidden;
    font-family: var(--kimi-font-sans,"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","MiSans","Microsoft YaHei",sans-serif);
  }
  .num, .title { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.0;
    font-weight: 700; letter-spacing: -0.02em; color: #002E58; }
  .desc { position: absolute; color: #002E58; line-height: 1.5;
    font-size: 16px !important; font-weight: 400; text-align: left; }
  .desc .tags { display: block; margin-top: 0.45em; opacity: 0.55; }
  svg.tex { position: absolute; display: block; }

  .title { font-size: 36px !important; font-weight: 700; line-height: 1.08; letter-spacing: 0; }
  .num { padding-inline: 12px; font-size: 36px !important; font-weight: 700; line-height: 1.08; letter-spacing: 0; }
  .desc { line-height: 1.5; }
  body > :first-child { border: none !important; outline: none !important; }
</style>
</head>
<body>
<main class="stage" id="stage" role="img" aria-label="第一步：真实信息，运行时刷新">

  <svg class="tex" id="tex"></svg>
  <div class="num" id="num">1</div>
  <div class="title" id="title">真实信息，<br>运行时刷新</div>
  <div class="desc" id="desc" aria-hidden="true"></div>
</main>
<script>
"use strict";
const INK = "#002E58";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function createGrid(W, H, cols, fixedRows) {
    const mx = 24, my = 32, g = 0.01 * W;
    const innerW = W - 2 * mx, innerH = H - 2 * my;
    const sCols = (innerW - (cols - 1) * g) / cols;
    const rows = fixedRows || Math.max(1, Math.round((innerH + g) / (sCols + g)));
    const s = Math.min(sCols, (innerH - (rows - 1) * g) / rows);
    const pitch = s + g;
    const gridW = cols * s + (cols - 1) * g, gridH = rows * s + (rows - 1) * g;
    const ox = mx + (innerW - gridW) / 2, oy = my + (innerH - gridH) / 2;
    return { s, rows, cols, pitch, x: c => ox + c * pitch, y: r => oy + r * pitch,
        span: n => n * s + (n - 1) * g };
}
function fit(el, maxW, maxH) {
    let lo = 12, hi = Math.max(12, maxH);
    for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        el.style.fontSize = mid + 'px';
        if (el.offsetWidth <= maxW * 0.98 && el.offsetHeight <= maxH * 0.98)
            lo = mid;
        else
            hi = mid;
    }
    el.style.fontSize = Math.floor(lo * 10) / 10 + 'px';
}
function jit(i, j) {
    const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
    return (x - Math.floor(x)) < 0.5;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const stage = document.getElementById('stage');
const num = document.getElementById('num');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const tex = document.getElementById('tex');
const NS = 'http://www.w3.org/2000/svg';
let rafId = null, texObj = null;
function buildTex(txt, bw, bh) {
    const TC = 48, TR = 18;
    const cw = bw / TC, chh = bh / TR, cell = Math.min(cw, chh);
    const fsBig = Math.max(12, cell / 0.6), fsSmall = Math.max(12, fsBig / 1.35);
    const WAVE = [12, 12, 12, 12, 12, 12, 12, 12, 12, 12, 11, 12, 12, 10, 7, 4, 2, 2, 6, 11, 14, 16, 16, 13, 12, 12,
        12, 12, 12, 12, 12, 12, 12, 12, 11, 10, 10, 11, 12, 12, 12, 12, 12, 12, 12, 12, 12];
    const stroke = new Set();
    for (let i = 0; i < TC; i++) {
        const a = WAVE[i], b = i + 1 < TC ? WAVE[i + 1] : a;
        for (let j = Math.min(a, b); j <= Math.max(a, b); j++)
            stroke.add(i + ',' + j);
    }
    const cells = [];
    function add(i, j, ch) {
        const fs = jit(i, j) ? fsBig : fsSmall;
        const ts = document.createElementNS(NS, 'tspan');
        ts.setAttribute('x', ((i + 0.5) * cw).toFixed(1));
        ts.setAttribute('y', (j * chh + chh / 2 + 0.33 * fs).toFixed(1));
        ts.setAttribute('font-size', fs.toFixed(1));
        ts.textContent = ch;
        txt.appendChild(ts);
        return ts;
    }
    for (const key of stroke) {
        const [i, j] = key.split(',').map(Number);
        cells.push({ el: add(i, j, '+'), i });
    }
    for (const [i, j, ch] of [[7, 3, '*'], [20, 15, '+'], [41, 4, '*'], [34, 16, '+']])
        add(i, j, ch);
    return {
        frame(t) {
            const p = ((t / 1000) * 11) % (TC + 14) - 7;
            for (const c of cells) {
                const behind = p - c.i;
                const ch = behind < 0 ? '+' : behind < 5 ? '⬢' : behind < 11 ? '#' : '+';
                if (c.el.textContent !== ch)
                    c.el.textContent = ch;
            }
        }
    };
}
function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H)
        return;
    const g = createGrid(W, H, 9, 2);
    const contentX = g.x(0), contentY = g.y(0);
    const contentW = g.span(4), contentH = g.span(2);
    const gap = Math.max(8, g.s * 0.12);
    num.style.left = contentX + 'px';
    num.style.width = 'auto';
    num.style.textAlign = 'left';
    num.style.fontSize = '36px';
    title.style.width = 'auto';
    title.style.textAlign = 'left';
    title.style.fontSize = '36px';
    const titleX = contentX + num.offsetWidth + gap;
    title.style.left = titleX + 'px';
    const groupH = Math.max(num.offsetHeight, title.offsetHeight);
    const groupY = contentY + Math.max(0, (contentH - groupH) / 2);
    num.style.top = groupY + 'px';
    title.style.top = groupY + 'px';
    desc.style.left = titleX + 'px';
    desc.style.top = contentY + 'px';
    desc.style.width = g.span(3) + 'px';
    desc.style.textAlign = 'left';
    const bx = g.x(4), by = g.y(0), bw = g.span(5), bh = g.span(2);
    tex.setAttribute('viewBox', `0 0 ${bw} ${bh}`);
    tex.style.left = bx + 'px';
    tex.style.top = by + 'px';
    tex.style.width = bw + 'px';
    tex.style.height = bh + 'px';
    tex.textContent = '';
    if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
    }
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-family', 'Menlo, "SF Mono", monospace');
    txt.setAttribute('fill', INK);
    tex.appendChild(txt);
    texObj = buildTex(txt, bw, bh);
    const FIXED_T = parseFloat(new URLSearchParams(location.search).get('ft'));
    const loop = (t) => {
        texObj.frame(Number.isFinite(FIXED_T) ? FIXED_T : t);
        if (!REDUCED)
            rafId = requestAnimationFrame(loop);
    };
    if (REDUCED)
        texObj.frame(1200);
    else
        rafId = requestAnimationFrame(loop);
}
document.fonts.ready.then(layout);
new ResizeObserver(layout).observe(stage);
</script>
</body>
</html>
