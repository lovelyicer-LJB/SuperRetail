<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEETBOX · 十六拍频道台</title>
<style>
  :root{


    --bg:#121212; --ink:#FFFFFF; --dim:#8E9390; --faint:#002E58; --faint2:#002E58;
    --blue:#00A1FF; --blue-l:#91D4FF;
    --mono:Menlo,"SF Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:var(--bg)}
  body{
    font-family:var(--mono); color:var(--ink);
    user-select:none; position:relative; overflow:hidden;
  }
  .stage{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;background:var(--bg)}
  .el{position:absolute}
  button{font-size:inherit;font-family:inherit}


  header{display:flex;align-items:flex-end;justify-content:space-between;gap:1em;flex-wrap:wrap}
  .logo-wrap{display:flex;align-items:flex-end;gap:0.9em}
  #logo{image-rendering:pixelated;display:block}
  #logo.beat{animation:beat .16s steps(2,end)}
  @keyframes beat{0%{opacity:.3}100%{opacity:1}}
  .sub{font-size:0.8em;letter-spacing:.22em;color:var(--dim);line-height:1.7;white-space:nowrap}
  .sub b{color:var(--ink);font-weight:700;font-size:1.35em;letter-spacing:.04em}

  .transport{
    display:grid;align-items:stretch;gap:0.6em;
    grid-template-columns:auto auto minmax(6em,1fr) minmax(6em,1fr) minmax(6em,1fr) auto;
  }
  .onair{align-self:center}
  .tbtn{
    background:var(--faint);border:none;color:var(--ink);
    font-family:var(--mono);font-size:0.95em;letter-spacing:.18em;
    padding:0 1.1em;height:3em;cursor:pointer;display:flex;align-items:center;gap:0.7em;
  }
  .tbtn:hover{background:var(--faint2)}
  #play{min-width:6em;justify-content:center}
  #play .ico{width:0;height:0;border-left:0.85em solid var(--ink);border-top:0.55em solid transparent;border-bottom:0.55em solid transparent}
  #play.on{background:#FFFFFF;color:#121212}
  #play.on .ico{border:none;width:0.8em;height:1em;background:#121212}
  #dilla{min-width:7.4em;justify-content:center;padding:0 .8em;letter-spacing:.08em;color:var(--blue-l)}
  #dilla[aria-pressed="true"]{background:#FFFFFF;color:#121212;box-shadow:inset 0 -3px 0 var(--blue)}
  .knob{
    background:var(--faint);padding:0.4em 0.8em 0.3em;height:3em;
    display:flex;flex-direction:column;justify-content:center;min-width:0;
  }
  .knob label{font-size:0.72em;letter-spacing:.22em;color:var(--dim);display:flex;justify-content:space-between;white-space:nowrap}
  .knob label output{color:var(--ink)}
  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:1.2em;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#8E9390}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:0.7em;height:1.1em;background:var(--ink);margin-top:-0.45em;border-radius:0;
  }
  .onair{
    display:inline-flex;align-items:center;gap:0.5em;font-size:0.8em;letter-spacing:.2em;
    color:var(--dim);padding:0.3em 0.2em;white-space:nowrap;
  }
  .onair .dot{width:0.55em;height:0.55em;background:#8E9390}
  .onair.live{color:var(--blue)}
  .onair.live .dot{background:var(--blue);animation:pulse 1s steps(2,end) infinite}
  @keyframes pulse{50%{opacity:.15}}


  .channels{display:flex;gap:0.55em;flex-wrap:wrap;align-content:flex-start;overflow:hidden}
  .ch{
    border:none;background:var(--faint);color:var(--dim);
    font-family:var(--mono);font-size:0.85em;letter-spacing:.14em;cursor:pointer;
    padding:0.55em 0.9em 0.45em;display:flex;align-items:center;gap:0.6em;white-space:nowrap;
  }
  .ch .num{color:var(--dim)}
  .ch:hover{background:var(--faint2);color:var(--ink)}
  .ch.on{background:#FFFFFF;color:#121212}
  .ch.on .num{color:var(--dim)}
  .ch.on::before{content:"";width:0.45em;height:0.45em;background:#007CFF;animation:pulse 1.2s steps(2,end) infinite}


  .seq{overflow:hidden}
  .row{display:grid;grid-template-columns:var(--labw,110px) 1fr;gap:0.7em;align-items:center;height:var(--rowh,16px)}
  .row + .row,.row + #rows,#rows .row + .row{margin-top:0.3em}
  #rows .row{height:var(--rowh,16px)}
  .steps{display:grid;grid-template-columns:repeat(16,1fr);gap:0.25em;height:100%}
  .steps .cell:nth-child(4n+1){margin-left:0.45em}
  .steps .cell:first-child{margin-left:0}

  .stephead{font-size:0.72em;color:var(--dim);text-align:center;letter-spacing:0}
  .stephead.beat{color:var(--ink)}
  .stephead.now{color:var(--blue)}

  .label{
    display:flex;align-items:center;gap:0.6em;cursor:pointer;padding:0 0.2em;
    font-size:0.82em;letter-spacing:.12em;color:var(--ink);white-space:nowrap;overflow:hidden;height:100%;
  }
  .label .chip{width:0.7em;height:0.7em;background:var(--ink);flex:none}
  .label .chno{color:var(--dim);font-size:0.9em}
  .label .zh{color:var(--dim);font-size:0.9em;letter-spacing:.06em}
  .row.muted .label{opacity:.32}
  .row.muted .label::after{content:"MUTE";color:var(--dim);font-size:0.9em;margin-left:auto;letter-spacing:.1em}
  .row.muted .cell{opacity:.25}

  .cell{
    background:var(--faint);cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:0.72em;color:transparent;line-height:1;overflow:hidden;
  }
  .cell:hover{background:var(--faint2)}
  .cell.on{background:#FFFFFF;color:#121212}
  .cell.now{background:var(--blue-l);color:#121212}
  .cell.on.now{background:var(--blue);color:#FFFFFF}
  .cell.hit{animation:hit .18s steps(2,end)}
  @keyframes hit{0%{filter:brightness(2.4)}100%{filter:none}}


  .keys-panel{overflow:hidden}
  .keys-head{display:flex;align-items:center;gap:0.7em;margin-bottom:0.7em;flex-wrap:wrap}
  #rec{
    background:var(--faint);border:none;color:var(--dim);
    font-family:var(--mono);font-size:0.85em;letter-spacing:.16em;cursor:pointer;
    padding:0.55em 1em 0.45em;display:flex;align-items:center;gap:0.6em;white-space:nowrap;
  }
  #rec .rdot{width:0.6em;height:0.6em;background:#8E9390}
  #rec:hover{background:var(--faint2)}
  #rec.on{background:#FFFFFF;color:#121212}
  #rec.on .rdot{background:#121212;animation:pulse .5s steps(2,end) infinite}
  .tgt{display:flex}
  .tgt button{
    background:var(--faint);border:none;color:var(--dim);font-family:var(--mono);
    font-size:0.85em;letter-spacing:.14em;padding:0.55em 0.9em 0.45em;cursor:pointer;white-space:nowrap;
  }
  .tgt button:hover{background:var(--faint2)}
  .tgt button.on{background:#FFFFFF;color:#121212}
  .keys-hint{font-size:0.75em;letter-spacing:.1em;color:var(--dim);margin-left:auto}
  .keys-hint .k{color:var(--ink)}
  .pads{display:grid;grid-template-columns:repeat(7,1fr);gap:0.35em}
  .pad{
    height:var(--padh,2.6em);background:var(--faint);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.2em;
  }
  .pad .nt{font-size:1.1em;color:var(--ink);letter-spacing:.08em}
  .pad .kb{font-size:0.72em;color:var(--dim);letter-spacing:.2em}
  .pad:hover{background:var(--faint2)}
  .pad.press{background:#FFFFFF}
  .pad.press .nt,.pad.press .kb{color:#121212}

  footer{
    font-size:0.78em;letter-spacing:.12em;color:var(--dim);line-height:1.9;
    display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap;overflow:hidden;
  }
  footer .k{color:var(--ink)}


  .field{overflow:hidden;cursor:crosshair}
  .field canvas{width:100%;height:100%;display:block}

  @media (max-width:620px){
    .transport{width:100%;grid-template-columns:auto auto minmax(6em,1fr)}
    .transport .tbtn{padding-left:.7em;padding-right:.7em}
  }
  @media (prefers-reduced-motion: reduce){
    #logo.beat,.cell.hit,.ch.on::before,.onair.live .dot,#rec.on .rdot{animation:none}
  }

  #logo { display: none; }
  .logo-wrap::before { content: "BEETBOX"; font-family: var(--mono); font-size: 28px; font-weight: 800; line-height: 1.08; letter-spacing: 0; color: var(--ink); }
  .sub, .sub b, .tbtn, .knob label, .onair, .ch, .stephead, .label, .label .chno, .label .zh, .row.muted .label::after, .cell, #rec, .tgt button, .keys-hint, .pad .nt, .pad .kb, footer { font-size: 12px !important; line-height: 1.4; }
  .seq { overflow: auto; }
  body > :first-child { border: none !important; outline: none !important; }
</style>
</head>
<body>
<main class="stage" aria-label="BEETBOX 十六拍频道台">
  <header class="el" id="hd">
    <div class="logo-wrap">
      <canvas id="logo"></canvas>
      <div class="sub"><b>节拍编排 · 频道台</b></div>
    </div>
    <div class="transport">
      <button class="tbtn" id="play"><span class="ico"></span><span id="playtxt">播放</span></button>
      <button class="tbtn" id="dilla" type="button" aria-pressed="false" title="开启确定性的推拉拍与力度起伏">DILLA TIME</button>
      <div class="knob">
        <label>速度 <output id="bpmv">120</output></label>
        <input type="range" id="bpm" min="70" max="170" value="120" step="1">
      </div>
      <div class="knob">
        <label>摇摆 <output id="swv">0%</output></label>
        <input type="range" id="swing" min="0" max="60" value="0" step="1">
      </div>
      <div class="knob">
        <label>音量 <output id="volv">90</output></label>
        <input type="range" id="vol" min="0" max="100" value="90" step="1">
      </div>
      <div class="onair" id="onair"><span class="dot"></span>播出中</div>
    </div>
  </header>

  <div class="el channels" id="channels"></div>

  <div class="el field" id="field" aria-hidden="true"><canvas></canvas></div>

  <div class="el seq" id="seq">
    <div class="row">
      <div class="label" style="cursor:default"><span class="chno">轨道</span><span class="zh">点名静音⇩</span></div>
      <div class="steps" id="stephead"></div>
    </div>
    <div id="rows"></div>
  </div>

  <div class="el keys-panel" id="keysPanel">
    <div class="keys-head">
      <button id="rec"><span class="rdot"></span>循环录制</button>
      <div class="tgt" id="tgt">
        <button data-t="lead" class="on">主旋律</button>
        <button data-t="bass">贝斯</button>
      </div>
      <span class="keys-hint"><span class="k">A S D F G H J</span> 或点按演奏 · 录制亮起时边放边录 · 自动量化循环叠录</span>
    </div>
    <div class="pads" id="pads"></div>
  </div>

  <footer class="el" id="ft">
    <span><span class="k">点击格子</span> 写入节拍 · <span class="k">DILLA TIME</span> 固定推拉拍与轻微力度起伏 · <span class="k">点击轨道名</span> 静音</span>
    <span><span class="k">空格</span> 播放/停止 · 摇摆控制律动强度</span>
  </footer>
</main>

<script>
"use strict";
const SORTED = " -+/()*▲K#⬢";
const FCELL = 12;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function cellHash(a, b) {
    let h = (Math.imul(a + 1, 374761393) + Math.imul(b + 1, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const fState = { on: false, ctx: null, w: 0, h: 0, cols: 0, rows: 0, offX: 0, offY: 0 };
const P = { x: -1e4, y: -1e4, t: -1e4 };
let laneAct = new Array(16).fill(0);
let curStep = -1, curStepT = -1e4;
function setupField(w, h) {
    const cv = document.querySelector(".field canvas");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fState.ctx = ctx;
    fState.w = w;
    fState.h = h;
    fState.cols = Math.ceil(w / FCELL);
    fState.rows = Math.max(1, Math.floor(h / FCELL));
    fState.offX = (w - fState.cols * FCELL) / 2;
    fState.offY = (h - fState.rows * FCELL) / 2;
    fState.on = true;
}
function drawField(t) {
    if (!fState.on)
        return;
    const { ctx, w, h, cols, rows, offX, offY } = fState;
    ctx.clearRect(0, 0, w, h);
    const breathe = 0.85 + 0.25 * Math.sin(t * 0.18 + 1);
    let rip = null;
    const dt = t - P.t;
    if (dt >= 0 && dt < 1.5) {
        const sig = FCELL * 2.6;
        rip = { amp: 0.55 * Math.exp(-dt * 2.0), phase: dt * 9, s2: 2 * sig * sig };
    }
    const bloom = curStep >= 0 ? 0.6 * Math.exp(-Math.max(0, t - curStepT) * 2.2) : 0;
    const buckets = [[], []];
    for (let r = 0; r < rows; r++) {
        const y = offY + r * FCELL + FCELL / 2;
        const v = rows > 1 ? r / (rows - 1) : 0.5;
        for (let c = 0; c < cols; c++) {
            const u = cols > 1 ? c / (cols - 1) : 0.5;
            const lane = Math.min(15, Math.floor(u * 16));
            const amp = (0.14 + 0.26 * (4 * v * (1 - v))) * breathe;
            let d = 0.10 + laneAct[lane] * 0.80
                + amp * (0.50 * Math.sin(c * 0.31 + r * 0.23 - t * 0.8)
                    + 0.32 * Math.sin(c * 0.12 - r * 0.31 + t * 0.5 + 2.0)
                    + 0.18 * Math.sin((c + r) * 0.19 - t * 1.2 + 4.2))
                + (cellHash(c * 3 + 1, r * 7 + 3) - 0.5) * 0.09;
            if (bloom > 0.001) {
                let dd = Math.abs(lane - curStep);
                dd = Math.min(dd, 16 - dd);
                d += bloom * Math.exp(-dd * dd / 2.2) * (0.55 + 0.45 * Math.sin(v * 6.28 + t * 6));
            }
            const x = offX + c * FCELL + FCELL / 2;
            if (rip) {
                const dx = x - P.x, dy = y - P.y;
                const q = (dx * dx + dy * dy) / rip.s2;
                if (q < 9)
                    d += rip.amp * Math.exp(-q) * Math.cos(rip.phase - Math.sqrt(q) * 3);
            }
            if (d <= 0.045)
                continue;
            const idx = Math.floor(Math.min(1, d) * (SORTED.length - 1));
            if (idx <= 0)
                continue;
            buckets[cellHash(c, r) < 0.5 ? 0 : 1].push(x, y, SORTED[idx], idx <= 2 ? (cellHash(c * 7 + 5, r * 11 + 2) < 0.10 ? "#91D4FF" : "#002E58")
                : idx <= 5 ? "#91D4FF" : idx <= 8 ? "#00A1FF" : "#FFFFFF");
        }
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const sizes = [Math.max(12, FCELL * 0.8), Math.max(12, FCELL * 0.62)];
    for (let b = 0; b < 2; b++) {
        ctx.font = sizes[b] + 'px Menlo, "SF Mono", "DejaVu Sans Mono", monospace';
        const a = buckets[b];
        for (let i = 0; i < a.length; i += 4) {
            ctx.fillStyle = a[i + 3];
            ctx.fillText(a[i + 2], a[i], a[i + 1] + sizes[b] * 0.03);
        }
    }
}
let raf = 0, lastF = 0;
function loop(now) {
    raf = requestAnimationFrame(loop);
    if (now - lastF < 66)
        return;
    lastF = now;
    drawField(now / 1000);
}
function startLoop() { if (!raf && !REDUCED && _tFix === null && !document.hidden)
    raf = requestAnimationFrame(loop); }
function stopLoop() { if (raf) {
    cancelAnimationFrame(raf);
    raf = 0;
} }
document.addEventListener("visibilitychange", () => { document.hidden ? stopLoop() : startLoop(); });
const fieldEl = document.getElementById("field");
fieldEl.addEventListener("pointermove", e => {
    if (REDUCED)
        return;
    const rc = fieldEl.getBoundingClientRect();
    P.x = e.clientX - rc.left;
    P.y = e.clientY - rc.top;
    P.t = performance.now() / 1000;
}, { passive: true });
(function () {
    const F = { B: ["111", "101", "110", "101", "111"], E: ["111", "100", "110", "100", "111"],
        T: ["111", "010", "010", "010", "010"], O: ["111", "101", "101", "101", "111"],
        X: ["101", "101", "010", "101", "101"] };
    const word = "BEETBOX", px = 4, gap = 1, sp = 2;
    const cols = word.length * (3 + sp) - sp, c = document.getElementById('logo');
    c.width = cols * (px + gap);
    c.height = 5 * (px + gap);
    const g = c.getContext('2d');
    g.fillStyle = "#FFFFFF";
    let x0 = 0;
    [...word].forEach((ch) => {
        F[ch].forEach((r, y) => [...r].forEach((b, x) => { if (b === "1")
            g.fillRect((x0 + x) * (px + gap), y * (px + gap), px, px); }));
        x0 += 3 + sp;
    });
})();
const NOTE_LABEL = ["", "A", "C", "D", "E", "G", "A⁺", "C⁺"];
const SEMI = [0, 3, 5, 7, 10, 12, 15];
const TRACKS = [
    { id: "lead", name: "LEAD", zh: "主旋律", type: "mel", root: 220 },
    { id: "bass", name: "BASS", zh: "贝斯", type: "mel", root: 55 },
    { id: "kick", name: "KICK", zh: "底鼓", type: "drum" },
    { id: "snr", name: "SNARE", zh: "军鼓", type: "drum" },
    { id: "clp", name: "CLAP", zh: "拍手", type: "drum" },
    { id: "chh", name: "HAT", zh: "闭镲", type: "drum" },
    { id: "ohh", name: "OPEN", zh: "开镲", type: "drum" },

    { id: "crs", name: "CRASH", zh: "吊镲", type: "drum" },

TRACKS.forEach(t => { state.steps[t.id] = new Array(16).fill(0); state.muted[t.id] = false; });
const PRESETS = [
    { name: "TECHNO", zh: "暗室", bpm: 132, swing: 0, p: {
            kick: "X...X...X...X...", clp: "....X.......X...", snr: "................",

            tom: "..............X.", cow: "................", shk: "X.X.X.X.X.X.X.X.",
            crs: "X...............",
            bass: "1..1..1.1..1..4.", lead: "..5...3.....7..6"
        } },
    { name: "FUNK", zh: "油渍", bpm: 104, swing: 22, p: {
            kick: "X..X..X...X..X..", snr: "....X..X....X..X", clp: "................",
            chh: "X.XX.XX.XX.XX.X.", ohh: "......X.......X.", rim: "..X.......X.....",
            tom: "................", cow: ".X.....X.X......", shk: "..X...X...X...X.",
            crs: "................",
            bass: "1.1..3.1..4.3.1.", lead: "..3.5....7.5.3.."
        } },
    { name: "HIPHOP", zh: "回街", bpm: 90, swing: 34, p: {
            kick: "X.....X..X..X...", snr: "................", clp: "....X.......X...",
            chh: "X.X.X.X.X.X.X.XX", ohh: "..............X.", rim: "......X.........",

    { name: "AFROBEAT", zh: "日光", bpm: 114, swing: 12, p: {

            chh: "X.XX.XX.X.XX.XX.", ohh: "................", rim: "..X..X..X...X..X",
            tom: ".....X.....X..X.", cow: "X..X..X.X..X..X.", shk: "X.X.X.X.X.X.X.X.",
            crs: "................",
            bass: "1..3..1..4..3.1.", lead: ".3.5.6.5..7.6.5."
        } },
    { name: "ACID", zh: "酸性", bpm: 140, swing: 8, p: {
            kick: "X...X...X...X...", snr: "....X.......X...", clp: "............X...",
            chh: ".X.X.X.X.X.X.X.X", ohh: "..X.......X.....", rim: "................",
            tom: "..........X...X.", cow: "................", shk: "................",
            crs: "........X.......",
