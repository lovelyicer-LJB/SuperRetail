<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* Milanote 风格待办卡片 —— 全部使用 Kimi 运行时 token */
  .mn-wrap {
    width: 100%;
    padding-block-start: var(--kimi-space-4);
    padding-inline: var(--kimi-space-4);
    padding-block-end: var(--kimi-space-4);
    font-family: var(--kimi-font-sans, sans-serif);
    box-sizing: border-box;
  }
  .mn-wrap button, .mn-wrap input, .mn-wrap textarea { font: inherit; }

  /* 卡片本体：纸面 + 细边 + 轻投影 */
  .mn-card {
    max-width: 560px;
    margin-inline: auto;
    background: var(--kimi-color-surface-raised);
    border: 1px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-panel);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
    padding: var(--kimi-space-4) var(--kimi-space-4) var(--kimi-space-2);
  }

  /* 头部：可编辑标题 + 完成计数 */
  .mn-head {
    display: flex;
    align-items: baseline;
    gap: var(--kimi-space-2);
    padding: 0 var(--kimi-space-2) var(--kimi-space-2);
  }
  .mn-title {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 500;
    line-height: 22px;
    color: var(--kimi-color-text-primary);
    outline: none;
    border-radius: var(--kimi-radius-small);
    padding: 0 2px;
    word-break: break-word;
  }
  .mn-title:empty::before {
    content: "待办清单";
    color: var(--kimi-color-text-quaternary);
  }
  .mn-title:focus { box-shadow: 0 0 0 1px var(--kimi-color-border); }
  .mn-count {
    font-size: 12px;
    line-height: 22px;
    color: var(--kimi-color-text-tertiary);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    flex-shrink: 0;
  }

  /* 列表 */
  .mn-list { display: flex; flex-direction: column; }

  .mn-item {
    display: flex;
    align-items: flex-start;
    gap: 2px;
    padding: 5px var(--kimi-space-2);
    border-radius: var(--kimi-radius-chip);
    position: relative;
  }
  .mn-item:hover { background: color-mix(in srgb, var(--kimi-color-text-primary) 4%, transparent); }
  .mn-item.is-dragging { opacity: .4; }
  .mn-item.is-drop-target { box-shadow: 0 2px 0 0 var(--kimi-color-text-primary); }

  /* 拖拽手柄：悬停出现 */
  .mn-grip {
    flex-shrink: 0;
    width: 18px;
    height: 24px;
    margin-top: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--kimi-color-text-quaternary);
    cursor: grab;
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease-out);
    border: none;
    background: none;
    padding: 0;
  }
  .mn-item:hover .mn-grip, .mn-item:focus-within .mn-grip { opacity: 1; }
  .mn-grip:active { cursor: grabbing; }
  .mn-grip svg { display: block; }

  /* 复选框：Milanote 方形圆角，勾选后深色填充白勾 */
  .mn-check {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 3px;
    border-radius: 5px;
    border: 1.5px solid var(--kimi-color-text-tertiary);
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    color: var(--kimi-color-surface-raised);
    transition: background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out), transform var(--t-micro) var(--ease-out);
  }
  .mn-check:hover { border-color: var(--kimi-color-text-primary); }
  .mn-check:active { transform: scale(.92); }
  .mn-check[aria-checked="true"] {
    background: var(--kimi-color-text-primary);
    border-color: var(--kimi-color-text-primary);
  }
  .mn-check kimi-icon { display: none; }
  .mn-check[aria-checked="true"] kimi-icon { display: inline-flex; }

  /* 文本：可编辑，完成时划线变浅 */
  .mn-text {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 24px;
    color: var(--kimi-color-text-primary);
    outline: none;
    word-break: break-word;
    padding-left: 6px;
  }
  .mn-text:empty::before {
    content: "写点什么…";
    color: var(--kimi-color-text-quaternary);
  }
  .mn-item.is-done .mn-text {
    color: var(--kimi-color-text-tertiary);
    text-decoration: line-through;
    text-decoration-color: var(--kimi-color-text-quaternary);
  }

  /* 删除按钮：悬停出现 */
  .mn-del {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: none;
    background: none;
    border-radius: var(--kimi-radius-chip);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--kimi-color-text-quaternary);
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
    padding: 0;
  }
  .mn-item:hover .mn-del, .mn-item:focus-within .mn-del { opacity: 1; }
  .mn-del:hover { color: var(--kimi-color-danger); }

  /* 底部新增按钮 */
  .mn-add {
    display: flex;
    align-items: center;
    gap: 6px;
    width: calc(100% - var(--kimi-space-4));
    margin: 2px var(--kimi-space-2) 0;
    padding: 6px 8px;
    border: none;
    background: none;
    border-radius: var(--kimi-radius-chip);
    font-size: 14px;
    line-height: 20px;
    color: var(--kimi-color-text-tertiary);
    cursor: pointer;
    text-align: left;
    transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .mn-add:hover {
    background: color-mix(in srgb, var(--kimi-color-text-primary) 4%, transparent);
    color: var(--kimi-color-text-primary);
  }
  .mn-add kimi-icon { flex-shrink: 0; }

  /* 空状态 */
  .mn-empty {
    padding: var(--kimi-space-4) var(--kimi-space-2);
    font-size: 14px;
    color: var(--kimi-color-text-quaternary);
    text-align: center;
  }
</style>
</head>
<body>
<div class="mn-wrap">
  <div class="mn-card" id="card">
    <div class="mn-head">
      <div class="mn-title" id="title" contenteditable="true" spellcheck="false" aria-label="清单标题"></div>
      <span class="mn-count" id="count"></span>
    </div>
    <div class="mn-list" id="list"></div>
    <div class="mn-empty" id="empty" hidden>还没有待办事项</div>
    <button class="mn-add" id="add" type="button">
      <kimi-icon name="PlusIcon" width="16" height="16"></kimi-icon>
      <span>添加一项</span>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var host = window.DaimonWidget || null;

  /* ---------- 状态 ---------- */
  var SAMPLE = {
    title: "待办清单",
    items: [
      { id: "s1", text: "收集灵感素材", done: true },
      { id: "s2", text: "整理项目情绪板", done: false },
      { id: "s3", text: "列出本周三个优先任务", done: false },
      { id: "s4", text: "给初稿留出批注时间", done: false }
    ]
  };

  var state = { title: SAMPLE.title, items: [] };
  var uid = 0;
  function nextId() { return "i" + Date.now().toString(36) + (uid++); }

  function load() {
    var saved = null;
    try {
      saved = host && host.inputState && host.inputState.currentInput;
    } catch (e) { saved = null; }
    if (saved && Array.isArray(saved.items)) {
      state.title = typeof saved.title === "string" ? saved.title : SAMPLE.title;
      state.items = saved.items.filter(function (it) {
        return it && typeof it.text === "string";
      }).map(function (it) {
        return { id: typeof it.id === "string" ? it.id : nextId(), text: it.text, done: !!it.done };
      });
    } else {
      state.title = SAMPLE.title;
      state.items = SAMPLE.items.map(function (it) {
        return { id: nextId(), text: it.text, done: it.done };
      });
    }
  }

  var saveTimer = null;
  function persist() {
    if (!host || typeof host.saveInput !== "function") return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        host.saveInput({
          title: state.title,
          items: state.items.map(function (it) {
            return { id: it.id, text: it.text, done: it.done };
          })
        });
      } catch (e) { /* 只读宿主忽略 */ }
    }, 250);
  }

  /* ---------- 渲染 ---------- */
  var listEl = document.getElementById("list");
  var titleEl = document.getElementById("title");
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");
  var addBtn = document.getElementById("add");

  var GRIP_SVG = '<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true">'
    + '<circle cx="3.5" cy="3" r="1.4"/><circle cx="8.5" cy="3" r="1.4"/>'
    + '<circle cx="3.5" cy="8" r="1.4"/><circle cx="8.5" cy="8" r="1.4"/>'
    + '<circle cx="3.5" cy="13" r="1.4"/><circle cx="8.5" cy="13" r="1.4"/></svg>';

  function renderCount() {
    var done = state.items.filter(function (it) { return it.done; }).length;
    countEl.textContent = state.items.length ? done + "/" + state.items.length : "";
    emptyEl.hidden = state.items.length > 0;
  }

  function buildRow(item) {
    var row = document.createElement("div");
    row.className = "mn-item" + (item.done ? " is-done" : "");
    row.dataset.id = item.id;

    var grip = document.createElement("button");
    grip.type = "button";
    grip.className = "mn-grip";
    grip.setAttribute("aria-label", "拖拽排序");
    grip.innerHTML = GRIP_SVG;
    grip.draggable = true;

    var check = document.createElement("button");
    check.type = "button";
    check.className = "mn-check";
    check.setAttribute("role", "checkbox");
    check.setAttribute("aria-checked", item.done ? "true" : "false");
    check.setAttribute("aria-label", item.done ? "标记为未完成" : "标记为完成");
    check.innerHTML = '<kimi-icon name="CheckIcon" width="12" height="12"></kimi-icon>';

    var text = document.createElement("div");
    text.className = "mn-text";
    text.contentEditable = "true";
    text.spellcheck = false;
    text.textContent = item.text;
    text.setAttribute("aria-label", "待办内容");

    var del = document.createElement("button");
    del.type = "button";
    del.className = "mn-del";
    del.setAttribute("aria-label", "删除");
    del.innerHTML = '<kimi-icon name="CloseIcon" width="14" height="14"></kimi-icon>';

    row.appendChild(grip);
    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(del);

    /* 勾选 */
    check.addEventListener("click", function () {
      item.done = !item.done;
      row.classList.toggle("is-done", item.done);
      check.setAttribute("aria-checked", item.done ? "true" : "false");
      check.setAttribute("aria-label", item.done ? "标记为未完成" : "标记为完成");
      renderCount();
      persist();
    });

    /* 编辑文本 */
    text.addEventListener("input", function () {
      item.text = text.textContent;
      persist();
    });
    text.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        var idx = state.items.indexOf(item);
        insertItem(idx + 1, "", true);
      } else if (e.key === "Backspace" && text.textContent === "") {
        e.preventDefault();
        var i = state.items.indexOf(item);
        removeItem(item);
        focusItem(i - 1);
      }
    });

    /* 删除 */
    del.addEventListener("click", function () {
      var i = state.items.indexOf(item);
      removeItem(item);
      focusItem(Math.min(i, state.items.length - 1));
    });

    /* 拖拽排序 */
    grip.addEventListener("dragstart", function (e) {
      dragId = item.id;
      row.classList.add("is-dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", item.id); } catch (err) {}
    });
    grip.addEventListener("dragend", function () {
      dragId = null;
      row.classList.remove("is-dragging");
      clearDropTargets();
    });
    row.addEventListener("dragover", function (e) {
      if (!dragId || dragId === item.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      clearDropTargets();
      row.classList.add("is-drop-target");
    });
    row.addEventListener("dragleave", function () {
      row.classList.remove("is-drop-target");
    });
    row.addEventListener("drop", function (e) {
      e.preventDefault();
      clearDropTargets();
      if (!dragId || dragId === item.id) return;
      moveItem(dragId, item.id);
    });

    return row;
  }

  var dragId = null;
  function clearDropTargets() {
    var t = listEl.querySelectorAll(".is-drop-target");
    for (var i = 0; i < t.length; i++) t[i].classList.remove("is-drop-target");
  }

  function moveItem(fromId, toId) {
    var from = -1, to = -1;
    state.items.forEach(function (it, i) {
      if (it.id === fromId) from = i;
      if (it.id === toId) to = i;
    });
    if (from < 0 || to < 0) return;
    var moved = state.items.splice(from, 1)[0];
    state.items.splice(to, 0, moved);
    renderList();
    persist();
  }

  function insertItem(index, text, focus) {
    var item = { id: nextId(), text: text || "", done: false };
    state.items.splice(index, 0, item);
    renderList();
    persist();
    if (focus) focusItem(index);
  }

  function removeItem(item) {
    var i = state.items.indexOf(item);
    if (i < 0) return;
    state.items.splice(i, 1);
    renderList();
    persist();
  }

  function focusItem(index) {
    if (index < 0 || index >= state.items.length) return;
    var row = listEl.children[index];
    if (!row) return;
    var t = row.querySelector(".mn-text");
    t.focus();
    /* 光标移到末尾 */
    var range = document.createRange();
    range.selectNodeContents(t);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function renderList() {
    listEl.innerHTML = "";
    state.items.forEach(function (item) {
      listEl.appendChild(buildRow(item));
    });
    renderCount();
  }

  /* 标题编辑 */
  titleEl.addEventListener("input", function () {
    state.title = titleEl.textContent;
    persist();
  });
  titleEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (state.items.length === 0) insertItem(0, "", true);
      else focusItem(0);
    }
  });

  addBtn.addEventListener("click", function () {
    insertItem(state.items.length, "", true);
  });

  /* ---------- 启动 ---------- */
  load();
  titleEl.textContent = state.title;
  renderList();
})();
</script>
</body>
</html>
